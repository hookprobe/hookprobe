title: Cloud/App Credential File Read by a Generic File Tool
id: 03071e15-6adc-40f2-bd8e-e39190c69ea3
status: experimental
description: >
  A generic file-reading/archiving tool (cat/less/more/head/tail/grep/strings/cp/tar/
  base64) exec'd with a well-known credential-file path in its argv (.aws/credentials,
  .kube/config, .docker/config.json, .npmrc, .pgpass, .netrc, wp-config.php) — the
  post-compromise "harvest cloud/app secrets from disk" step. AND across two selections
  (tool name x target path), same idiom as sigma_suspicious_download_exec.yml. Not
  covered by host_edr (its only credential-access check is /etc/shadow) — real NEW
  coverage of a materially different, very common real-world target class.
  HONEST FALSE-POSITIVE NOTE: legitimate CI/CD, ops, and deploy tooling reads these exact
  files as their normal job — this WILL fire on routine `cat ~/.npmrc` or an Ansible task
  templating wp-config.php. Kept at `medium`/`experimental`, intended as a corroborating
  signal, not a stand-alone high-confidence alert.
logsource:
  category: process_creation
  product: linux
detection:
  sel_tool:
    Image:
      - "cat"
      - "less"
      - "more"
      - "head"
      - "tail"
      - "grep"
      - "strings"
      - "cp"
      - "tar"
      - "base64"
  sel_target:
    CommandLine|contains:
      - ".aws/credentials"
      - ".kube/config"
      - ".docker/config.json"
      - ".npmrc"
      - ".pgpass"
      - ".netrc"
      - "wp-config.php"
  condition: sel_tool and sel_target
level: medium
tags:
  - attack.credential-access
  - attack.t1552.001
