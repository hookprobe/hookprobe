# Senzorium flow capture needs conntrack byte/packet accounting for NAPSE's entity features
# (bytes_sent/received, packet counts). OFF by default in the kernel — enable it here so the
# software flow-capture path produces meaningful records. Applied at boot by systemd-sysctl.
net.netfilter.nf_conntrack_acct = 1
net.netfilter.nf_conntrack_timestamp = 1
