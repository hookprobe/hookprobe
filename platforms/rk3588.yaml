# platforms/rk3588.yaml — build-team INPUT for the Rockchip RK3588 family.
# The bootstrap generator combines this with detected hardware facts to emit a
# signed Platform Manifest (schema 2; see manifest/schema + docs/adr/0003).
# "Add hardware = one file in platforms/." No scanner/mapper/UI/API change.

profile: rk3588
class: edge-pro
sku: HP-EP-001            # default marketing SKU; cosmetic

# CPU microarch tier for per-tier AOT blob selection (ADR 0017/0021). The RK3588's big cores
# are Cortex-A76 (ARMv8.2, LSE atomics; the A55 LITTLE cores are ARMv8.2 too), so the loader
# may select the faster `<id>.a76.cwasm` blob over the A72-safe baseline. Data-driven — one
# line; the manifest freezes it into `hardware.cpu.tier`, loader fails closed to baseline.
cpu_tier: cortex-a76

# Retirement audit #8 (2026-07-08): honesty marker — only platforms/rpi4.yaml carries a
# real on-silicon boot+selftest gate record (docs/BuildPlan.md). rk3588 has no boot-gate
# record yet (no image has been booted on real RK3588 silicon).
hardware_validated: false
validation_note: "classification-tested; no on-silicon boot-gate record yet"

# How the classifier matches this profile.
# ARM priority path = device-tree `compatible` tokens (more deterministic than DMI).
# Match if ANY token below appears in /proc/device-tree/compatible (NUL-split).
match:
  method: device-tree
  device_tree_compatible:
    - rockchip,rk3588
    - rockchip,rk3588s
    - rockchip,rk3588j     # industrial-temp variant; most boards also list rk3588 as a
                           # fallback token, but match it explicitly so an rk3588j-only
                           # device-tree can never fall through to `generic` (losing NPU/OVS).

# Minimum / recommended spec. Builder warns when a target is under `min`.
spec:
  min:         { cores: 4, memory_mb: 4096, storage_gb: 16 }
  recommended: { cores: 8, memory_mb: 8192, storage_gb: 64 }

# Resource policy → manifest.resources. cpu_pct: 100 = one core.
# allocatable is computed by the generator as total - reserved.
resources:
  reserved:  { cpu_pct: 150, memory_mb: 2048 }   # host + local backend
  defaults:
    wasm:      { cpu_pct: 25,  memory_mb: 128, epoch_ms: 50 }
    container: { cpu_pct: 100, memory_mb: 512 }

# Capability policy. The mapper resolves each token as:
#   grant = presence (requires satisfied by facts)
#         ∧ known-good (passes any known_good/quirk rule)
#         ∧ policy     (policy: enabled)
# Resulting state ∈ granted | present_unsafe | policy_denied | absent.
# `requires` expressions reference manifest facts (grammar finalized with the
# Phase-1 mapper; kept human-readable here and mirrored in capability `evidence`).
capabilities:
  soc:
    requires: [cpu, memory_mb]
    policy: enabled
  ids:
    requires: [soc]
    policy: enabled
  openvswitch:
    requires: [arch, "network.interfaces>=2"]
    policy: enabled
  wifi_ap:
    requires: ["wifi.present"]
    policy: enabled
  edge_ai:
    # RK3588 carries a 6-TOPS NPU (RKNPU). This grants ONLY when the probe sees the
    # accelerator's kernel driver actually loaded (`npu.driver_ready` = /dev/rknpu or the
    # rknpu debugfs node exists) AND >=8 GB RAM. If the image does not vendor the rknpu
    # driver + the RKNN WASI-NN backend, `driver_ready` is false and edge_ai honestly
    # resolves to `absent` with the "NPU present but driver not loaded" reason — never a
    # fabricated grant. CROSS-DOMAIN (release-engineer): the rk3588 image variant MUST
    # vendor the rknpu kernel module + RKNN runtime, else this 6-TOPS capability stays dark.
    requires: ["npu.driver_ready", "memory_mb>=8192"]
    policy: enabled
  inline_ips:
    requires: ["network.role:inline"]
    policy: enabled
    # NIC offload (TSO/LRO) on RK3588 is not yet validated on any onboard/PCIe
    # driver — so an inline interface resolves to `present_unsafe` (rendered
    # disable-with-reason) until a driver is added to known_good_nic_drivers.
    known_good_nic_drivers: []

  # --- engine-derived capability tokens (see docs/runtime-engine-map.md) ---
  capture:          { requires: [soc], policy: enabled }            # packet/host capture (Senzorium)
  host_telemetry:   { requires: [soc], policy: enabled }            # eBPF process/file/syscall telemetry
  # base-tier-build-ticket.md Phase 1/2 (ADR 0003 "Base-tier capability tokens", ADR 0031 §C/§E).
  # `tc_bpf` was documented in ADR 0003 but never added to this file's `capabilities:` map — the
  # already-shipped `dataplane-tune-apply.sh`/`hookprobe-tune-bcm2712.service` gate on it
  # (`capability_state tc_bpf`), so it always resolved `absent` on a real device; fixed here as a
  # direct prerequisite of `resource_shed_v2` (flagged, not silently folded in). Same grant-basis
  # simplification as rpi5.yaml: `capture` already implies the BPF+BTF-capable capture path.
  tc_bpf:           { requires: [capture], policy: enabled }
  resource_shed_v2: { requires: [tc_bpf], policy: enabled }         # eBPF PSI pressure-valve (shed-v2)
  # `ml_cpu` — base-tier-build-ticket.md Phase 4 (ADR 0014 D6): dga-lm's int8 SDOT fast path.
  # Big cores here are Cortex-A76 (this file's `cpu_tier: cortex-a76` above) -> granted by the
  # mapper's `ml_cpu` known-good step (crates/hookprobe-manifest's capabilities::compute_one).
  ml_cpu:           { requires: [soc], policy: enabled }            # A76 big-cores -> granted
  # `ptp_hw` — base-tier-build-ticket.md Phase 3 (ADR 0031 §B). RK3588 boards vary NIC silicon
  # (no shared macb assumption here, same caveat as `dataplane_tuning` below) — the real
  # per-board `ethtool -T <iface>` fact (`network.hw_timestamping`) decides, never a static
  # platform-class guess; declared uniformly across the base tier, same as `ml_cpu` above.
  # STATUS 2026-07-16 (Pi4+CM5 metal): policy DECLARED but FACT-GATED — `ethtool -T` on the macb
  # reports no hardware timestamping (TSU not exposed behind RP1/GEM), so capabilities.rs keeps
  # `ptp_hw` UNGRANTED and ptp4l/phc2sys cleanly no-op. NOT a shipping HW-sync capability yet.
  ptp_hw:           { requires: ["network.hw_timestamping"], policy: enabled }
  ddos_mitigation:  { requires: [capture], policy: enabled }        # XDP-speed drop/flag
  sdn:              { requires: [openvswitch], policy: enabled }     # OVS software-defined networking
  wifi_dfs:         { requires: [wifi_ap], policy: enabled }        # DFS channels for the AP
  dns_filtering:    { requires: [soc], policy: enabled }            # dnsXai DGA/DNS-anomaly
  threat_intel:     { requires: [soc], policy: enabled }            # STIX/TAXII + MISP enrichment (Intelligence)
  deception:        { requires: [soc], policy: enabled }            # mirage honeypots
  multi_wan:        { requires: ["network.interfaces>=2"], policy: enabled }
  ai_planner:       { requires: [soc], policy: enabled }            # AEGIS BYO-LLM planner (model = operator config)
  secure_tunnel:    { requires: [soc], policy: enabled }            # edge-to-edge PQC VPN data plane (HTP successor)
  fleet_mesh:       { requires: [soc], policy: disabled }           # ADDITIVE federation/coordination; enabled on enrollment (standalone-first)

# Active crypto suite (resolved from docs/adr/0002 at build time).
crypto_suite: hookprobe-pqc-hybrid-2026

# Retention is bounded by ACTUAL storage at first boot; these are proportional
# tier caps (fraction of the usable data partition). The generator computes the
# absolute cap_gb + the honest current window from real disk size.
retention:
  tier_fractions: { pcap: 0.15, events: 0.35, evidence: 0.30 }

# base-tier-build-ticket.md Phase 1 (ADR 0031 amendment §C) — dataplane tuning recipe,
# consumed by base/scripts/dataplane-tune-apply.sh via hookprobe-tune-bcm2712.service.
# Applied ONLY where `tc_bpf` is granted; flat hand-authored scalars (awk/sed-parsed, no
# YAML library — same convention as the Containerfile Layer A4 profile-package-overlay
# parser). RK3588 big.LITTLE topology: 4×Cortex-A55 LITTLE on cores 0-3, 4×Cortex-A76 big
# on cores 4-7 (two clusters, treated as one "big" pool here — this phase pins by
# cluster, not by individual big-cluster frequency bin). An unpinned scheduler puts the
# 50 ms-epoch QSECBIT tick on an A55 and blows the budget (ADR 0031 §C) — pin NAPI +
# detection to the A76 pool, housekeeping/retention/telemetry to the A55 pool.
dataplane_tuning:
  napi_threaded: true
  gro: true
  # NIC RX IRQ pinned into the A76 pool (whichever onboard/PCIe MAC this board carries —
  # deliberately NOT macb-specific here; RK3588 boards vary NIC silicon, so
  # dataplane-tune-apply.sh resolves the real WAN/LAN interface names from ifaces.env,
  # never a hardcoded driver name).
  irq_affinity_cpus: 4-7
  # QSECBIT/NAPSE epoch workers (hookprobe-live.slice) — the full A76 pool.
  detection_allowed_cpus: 4-7
  # RPS default OFF (ADR 0031 §C — default-on is NOT adopted). Opt-in only; when enabled,
  # core 5 (inside the A76 pool, away from the detection cpuset's core 4 NAPI target).
  rps_default: false
  rps_cpu_mask: 5
  # big.LITTLE housekeeping pin: hookprobe-background.slice (retention/telemetry/
  # housekeeping) confined to the A55 LITTLE cluster, freeing the A76 pool for the
  # latency-sensitive NAPI + detection path above.
  housekeeping_allowed_cpus: 0-3
