# platforms/generic.yaml — the FALLBACK profile.
# Matches when no other platform profile matches (lowest priority). Guarantees the
# local-first invariant: a full baseline SOC still runs on unrecognized hardware,
# but every hardware-unlocked extra is conservatively WITHHELD until a real profile
# validates it. See docs/Readme.md "capabilities, not branches" + local-first.

profile: generic
class: generic
sku: null

# Retirement audit #8 (2026-07-08): honesty marker — only platforms/rpi4.yaml carries a
# real on-silicon boot+selftest gate record (docs/BuildPlan.md). generic is the fallback
# profile for unrecognized hardware and has no boot-gate record of its own.
hardware_validated: false
validation_note: "classification-tested; no on-silicon boot-gate record yet"

# `fallback` always matches; the classifier tries device-tree → dmi-tuple → virt
# first and only falls back here when none match.
match:
  method: fallback

spec:
  min: { cores: 2, memory_mb: 2048, storage_gb: 8 }

resources:
  reserved:  { cpu_pct: 150, memory_mb: 1536 }   # leaner reserve on unknown/small boxes
  defaults:
    wasm:      { cpu_pct: 25,  memory_mb: 128, epoch_ms: 50 }
    container: { cpu_pct: 100, memory_mb: 512 }

# Conservative baseline. The dividing line is HARDWARE-unlocked vs SOFTWARE-only:
#   * SOFTWARE-only SOC engines that need nothing but the CPU + the image's own kernel
#     (host_telemetry/EDR, dns_filtering, threat_intel — on top of soc + ids) are ENABLED,
#     so an unrecognized box STILL runs a full local SOC (the "standalone by default"
#     invariant). This also keeps the manifest honest: hydra (threat-intel) and dnsxai
#     (dns-filtering) already load via `soc`, so reporting those tokens as denied would
#     LIE about what is actually running.
#   * HARDWARE- or DATA-PATH-gated extras (capture=XDP NIC datapath, ddos_mitigation, sdn,
#     openvswitch, wifi_ap/dfs, edge_ai, inline_ips, multi_wan, fleet_mesh, secure_tunnel)
#     stay policy: disabled — on unknown hardware the NIC offload / radio / NPU / inline
#     path is UNVALIDATED, so they resolve to policy_denied (present) or absent (missing)
#     until a real profile in platforms/ validates the silicon. deception/ai_planner are
#     withheld too (no always-on honeypot engine ships; the AI planner is additive/BYO-LLM).
capabilities:
  soc:
    requires: [cpu, memory_mb]
    policy: enabled
  ids:
    requires: [soc]
    policy: enabled
  openvswitch:
    requires: [arch, "network.interfaces>=2"]
    policy: disabled
  wifi_ap:
    requires: ["wifi.present"]
    policy: disabled
  edge_ai:
    requires: ["npu.driver_ready", "memory_mb>=8192"]
    policy: disabled
  inline_ips:
    requires: ["network.role:inline"]
    policy: disabled
    known_good_nic_drivers: []

  # --- engine-derived tokens ---
  # SOFTWARE-only SOC engines: enabled so unknown hardware runs a real local SOC.
  host_telemetry:   { requires: [soc], policy: enabled }        # eBPF host EDR (image-provided kernel; no special HW)
  dns_filtering:    { requires: [soc], policy: enabled }        # dnsXai DGA/DNS-anomaly (userspace; already loads via soc)
  threat_intel:     { requires: [soc], policy: enabled }        # HYDRA enrichment (userspace; already loads via soc)
  # HARDWARE / DATA-PATH-gated: conservatively withheld until a real profile validates the silicon.
  capture:          { requires: [soc], policy: disabled }       # XDP NIC datapath — offload unvalidated on unknown HW
  ddos_mitigation:  { requires: [capture], policy: disabled }
  sdn:              { requires: [openvswitch], policy: disabled }
  wifi_dfs:         { requires: [wifi_ap], policy: disabled }
  deception:        { requires: [soc], policy: disabled }       # no always-on honeypot engine ships (don't fabricate)
  multi_wan:        { requires: ["network.interfaces>=2"], policy: disabled }
  ai_planner:       { requires: [soc], policy: disabled }       # additive/BYO-LLM; deterministic reconciler still runs via soc
  secure_tunnel:    { requires: [soc], policy: disabled }       # additive edge VPN
  fleet_mesh:       { requires: [soc], policy: disabled }

crypto_suite: hookprobe-pqc-hybrid-2026

retention:
  tier_fractions: { pcap: 0.10, events: 0.35, evidence: 0.30 }
