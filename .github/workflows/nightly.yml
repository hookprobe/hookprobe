# =============================================================================
# nightly.yml — L3 Watch (ADR 0052). The full gate ladder on main every night, with
# a FRESH RustSec/npm advisory database, plus the gates too slow for every PR:
#
#   g0 g1 g4   as in ci.yml, but against today's advisory DB (new CVEs on unchanged code)
#   g2         validate.sh (QEMU) unconditionally — not path-filtered like build-heqk.yml
#   g3         Mission Control e2e incl. the real-browser HTTPS/PQ leg
#   g4r        reproducible build of the shipped `prod` kernel (ADR 0036 Rung 1)
#   matrix     regenerates the validation matrix from the live run and PROPOSES it as a PR
#              (replaces os/kernel/.github/workflows/validation-matrix.yml, which was inert
#              after the merge AND pushed straight to main, bypassing every gate)
#   cortex     folds every gate result into one Cortex lifecycle artifact (L5 Learn)
#
# Any red job → autoheal.yml triages it (default branch → autofix eligible).
# =============================================================================
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CI_STRICT: "1"
  CARGO_TERM_COLOR: never
  HEQK_QEMU_TIMEOUT: "900"

jobs:
  g0:
    name: "g0 · hygiene + CI wiring"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/gates.sh g0
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-g0, path: out/ci, if-no-files-found: ignore }

  g1:
    name: "g1 · clippy ratchet + unit tests + phase ratchet"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools, clippy
          targets: aarch64-unknown-none-softfloat, wasm32-wasip1
      - run: tools/ci/gates.sh g1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-g1, path: out/ci, if-no-files-found: ignore }

  g2:
    name: "g2 · QEMU boot gate + validation matrix"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write          # only for the matrix PR branch
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 (main only — trusted; create-pull-request pushes with these credentials)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8   # master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none-softfloat, wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm mtools dosfstools fdisk
      - run: tools/ci/gates.sh g2
      - name: Regenerate the validation matrix from the live run
        if: success()
        working-directory: os/kernel
        run: python3 tools/gen-validation.py && python3 tools/gen-readme-matrix.py
      - name: Propose the matrix update (PR, never a direct push)
        if: success()
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676   # v7
        with:
          branch: bot/validation-matrix
          title: "docs(heqk): refresh validation matrix from the nightly QEMU run"
          commit-message: "docs(heqk): refresh validation matrix (nightly)"
          add-paths: |
            os/kernel/heqk-validation.html
            os/kernel/README.md
          labels: automated
          body: Generated by nightly.yml from a green `validate.sh` run (ADR 0052). Review and merge.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: nightly-g2, path: out/ci, if-no-files-found: ignore }

  g3:
    name: "g3 · Mission Control e2e (QEMU + real browser)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none-softfloat, wasm32-wasip1
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm mtools dosfstools fdisk
          cd os/kernel/tools/mc-e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: tools/ci/gates.sh g3
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-g3, path: out/ci, if-no-files-found: ignore }

  g4:
    name: "g4 · supply chain (fresh advisory DB)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - uses: anchore/sbom-action/download-syft@v0
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: tools/ci/gates.sh g4
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-g4, path: out/ci, if-no-files-found: ignore }

  g4r:
    name: "g4r · reproducible prod kernel"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none-softfloat, wasm32-wasip1
      - run: tools/ci/gates.sh g4r
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-g4r, path: out/ci, if-no-files-found: ignore }

  cortex:
    name: "L5 · fold results into the Cortex lifecycle log"
    if: always()
    needs: [g0, g1, g2, g3, g4, g4r]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: nightly-*, path: in }
      - run: |
          for r in in/*/gate-results.json; do
            [ -f "$r" ] && python3 tools/ci/cortex/ci_to_cortex.py "$r" --out out/ci/cortex-events.jsonl
          done
          [ -f out/ci/cortex-events.jsonl ] && cat out/ci/cortex-events.jsonl || echo "no gate results"
      - uses: actions/upload-artifact@v4
        with: { name: nightly-cortex-events, path: out/ci/cortex-events.jsonl, if-no-files-found: ignore }
