# =============================================================================
# secrets-scan.yml — the standing secrets gate (ADR 0046 D5: "a gitleaks
# pre-push gate, wired into CI and local hooks"). Runs on every push + PR and
# is a HARD BLOCK on any detected secret — this is the CI backstop for the
# local `scripts/hooks/pre-push` tripwire (belt-and-suspenders; a developer
# can skip a local hook, they cannot skip this).
#
# Context (2026-07-25 Phase-0 GitHub-prep): the monorepo's history was just
# purged with git-filter-repo (builder/release.key + *.mldsa signing-key
# blobs, ~80MB kernel .deb bloat, .claude/cortex/ telemetry, and a personal
# dev credential (a username + its shadow hash)) BEFORE the heqk 316-commit
# history was inherited under kernel/heqk/ (ADR 0046 D1-D3). This workflow is
# the thing that keeps that regressing after the first public push.
#
# Two jobs, defense-in-depth:
#   gitleaks    — the real scanner (gitleaks/gitleaks-action@v2), full ruleset
#                 + .gitleaks.toml allowlist (path-scoped, see that file's
#                 comments for why each entry is safe). This is the primary
#                 gate; it needs network egress to pull the gitleaks binary,
#                 which CI has and this dev box does not (see pre-push hook).
#   grep-tripwire — pure grep/ripgrep, no external binary, no network. Cheap
#                 defense-in-depth using GENERIC high-value patterns (PEM keys,
#                 cloud tokens, any Unix shadow-password hash, any personal
#                 webmail domain) — deliberately NOT the specific personal
#                 literals this repo scrubbed once, so the guard itself carries
#                 no PII. If any such secret-shaped string appears in the tree,
#                 this job fails even if gitleaks' generic rules somehow miss it.
#
# HONESTY: gitleaks/trufflehog binaries are blocked on this dev box (CDN
# egress firewalled) — the grep-tripwire job is the one actually exercised
# locally (see scripts/hooks/pre-push, same patterns). The gitleaks job is
# the canonical definition; it runs once this repo is pushed to GitHub.
# =============================================================================
name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) gitleaks — primary scanner. Full checkout history so a secret buried in
  #    an older commit on this branch/PR is still caught, not just the tip.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: "gitleaks (full ruleset + .gitleaks.toml allowlist)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just the tip -- see the gitleaks job header

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_CONFIG defaults to `.gitleaks.toml` at the repo root if present
          # (gitleaks-action auto-detects it) -- explicit here for clarity/pinning.
          GITLEAKS_CONFIG: .gitleaks.toml
          # No GITLEAKS_LICENSE: this repo is open-core/public (CLAUDE.md "open-core"),
          # so the action runs in its free (no-license) detect mode.

  # ---------------------------------------------------------------------------
  # 2) grep-tripwire — no external binary, no network egress. Defense-in-depth
  #    plus a hard regression check for the two tokens already scrubbed once.
  #    Mirrors scripts/hooks/pre-push exactly (same patterns, same exit logic)
  #    so a developer sees the identical failure locally before ever pushing.
  # ---------------------------------------------------------------------------
  grep-tripwire:
    name: "grep tripwire (PEM keys / cloud tokens / scrubbed-credential regression)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Grep the working tree for known secret shapes + regression tokens
        run: |
          set -uo pipefail
          FOUND=0

          check() {
            local label="$1"; shift
            local pattern="$1"; shift
            # -I: skip binary files. Exclude .git/ (history is gitleaks' job above,
            # not this working-tree grep) and this workflow file itself (it must be
            # allowed to mention the patterns it's grepping for).
            local hits
            hits="$(rg -n --hidden -I \
                     -g '!.git/' \
                     -g '!.github/workflows/secrets-scan.yml' \
                     -g '!scripts/hooks/pre-push' \
                     -g '!.gitleaks.toml' \
                     "$pattern" . || true)"
            if [ -n "$hits" ]; then
              echo "::error::SECRET TRIPWIRE [$label] matched:"
              echo "$hits"
              FOUND=1
            fi
          }

          # PEM private-key headers.
          check "PEM private key"   'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY'
          # GitHub tokens (personal/OAuth/server-to-server).
          check "GitHub token"      '\b(ghp|gho|ghs|ghu|ghr)_[A-Za-z0-9]{20,}'
          # AWS access key IDs.
          check "AWS access key"    '\bAKIA[0-9A-Z]{16}\b'
          # Slack tokens (bot/app/user/config/refresh).
          check "Slack token"       '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
          # Any Unix sha512crypt shadow-password hash ($6$salt$hash) -- this is
          # the *class* of the credential scrubbed on 2026-07-25, caught
          # generically so this guard embeds no personal literal of its own.
          check "Unix shadow password hash" '\$6\$[./A-Za-z0-9]{8,}\$[./A-Za-z0-9]{20,}'
          # Any personal-webmail address in the tree (the project's own contact
          # is a hookprobe.com address; a personal domain here is a PII leak).
          check "personal email address" '@(hotmail|gmail|outlook|yahoo|icloud|proton(mail)?|aol)\.[a-z]{2,}'

          if [ "$FOUND" -ne 0 ]; then
            echo "::error::one or more secret-shaped strings found in the working tree -- see above. If this is a false positive, add a tight, commented, path-scoped allowlist entry to .gitleaks.toml (for the gitleaks job) and/or narrow the pattern here; do NOT silently delete the check."
            exit 1
          fi
          echo "OK: no secret-shaped strings found"
