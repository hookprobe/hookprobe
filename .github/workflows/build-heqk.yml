# =============================================================================
# build-heqk.yml — Track C / Milestone M1 CI beachhead for the heqk microkernel
# substrate (ADR 0043/0044, docs/architecture/MIGRATION-heqk.md). heqk lives at os/kernel
# as its OWN nightly no_std / build-std / aarch64-unknown-none-softfloat Cargo
# workspace (excluded from the root workspace — see Cargo.toml `exclude`), with
# its own proven local gate: os/kernel/validate.sh. This workflow does NOT
# reimplement that gate — it installs the toolchain heqk's rust-toolchain.toml
# pins + qemu, then INVOKES validate.sh verbatim, so CI and a developer's box
# can never silently diverge (same DRY principle as gate-ladder.yml).
#
# HONESTY (ADR 0044 D5 / docs/roadmap/BuildPlan.md Track-C honesty header): the job
# below is the **QEMU gate**, not a metal gate. A green run proves the kernel
# boots + every IMPLEMENTED phase's PASS marker fires under QEMU's `virt`
# machine (cortex-a72, softfloat, virtio-net) — it proves NOTHING about the
# real CM5/RP1 metal target (P7 in validate.sh's own table is explicitly
# PLANNED, not gated here) and it does not run, flash, or sign anything.
# Metal bring-up and the signed heqk8.img artifact are separate, later gates
# (M2+; see os/build/make-cm5-heqk-image.sh, which needs a private heqk-sign
# key this CI environment deliberately does not have — see note at the bottom
# of this file).
#
# Toolchain reality (os/kernel/rust-toolchain.toml): channel = "nightly"
# (NOT date-pinned — heqk floats on nightly by its own choice, independent of
# this repo's root workspace, which pins stable 1.96.0 in gate-ladder.yml).
# components = rust-src (build-std) + llvm-tools; target =
# aarch64-unknown-none-softfloat. dtolnay/rust-toolchain@nightly below mirrors
# that pin exactly (no drift risk since heqk itself carries no date pin to
# drift against); the checked-out os/kernel/rust-toolchain.toml remains the
# authoritative override the moment any cargo command runs inside that dir.
# =============================================================================
name: build-heqk

on:
  push:
    branches: [main]
    paths:
      - "os/kernel/**"
      - "os/build/**"
      - "os/mission-control/**"
      - ".github/workflows/build-heqk.yml"
  pull_request:
    paths:
      - "os/kernel/**"
      - "os/build/**"
      - "os/mission-control/**"
      - ".github/workflows/build-heqk.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # heqk-qemu-gate — THE primary, must-work M1 job. Builds heqk (--features
  # netsvc, matching validate.sh's own build invocation), boots it under QEMU
  # `virt`, and checks every IMPLEMENTED phase's PASS marker. This is a QEMU
  # gate ONLY — see the honesty note in the file header. validate.sh itself
  # exits non-zero on any built-phase regression or a broken build, so this
  # job needs no extra pass/fail parsing beyond the script's own exit code.
  # ---------------------------------------------------------------------------
  heqk-qemu-gate:
    name: "heqk QEMU gate (validate.sh — NOT a metal gate)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly toolchain (os/kernel/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: os/kernel

      - name: Install qemu-system-aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: heqk validate.sh (build + QEMU boot + phase-gate report)
        run: ./validate.sh
        working-directory: os/kernel

      # validate.sh boots the QEMU flavor only. The shipped flavors: `prod` / `prod-mc` (GEM sensor) and the
      # Wi-Fi AP product `hboot,apmc,wifi-bigtx,appersist` (G12, 2026-11-09). `prod`+`apmode` stays refused:
      # they are two alternative never-returning loops (the AP one would make `prod`'s unreachable).
      - name: heqk shipped-flavor gate (prod, prod-mc, AP product build; prod+apmode refused; no Wi-Fi creds in source)
        working-directory: os/kernel
        run: |
          set -euo pipefail
          cargo build -p kernel --features prod --release
          # prod-mc = THE production CM5 profile (ADR 0047: Mission Control served by heqk on the
          # GEM, passive-first). It embeds the UI, so build os/mission-control/dist first (same-origin API).
          (cd ../mission-control && npm ci --no-audit --no-fund && PUBLIC_API_BASE='' npm run build)
          cargo build -p kernel --features prod-mc --release
          if cargo build -p kernel --features prod,apmode --release 2>/tmp/apmode.log; then
            echo "FATAL: prod+apmode built — the AP bench loop would replace the IPS service"; exit 1
          fi
          grep -q "cannot be combined with \`prod\`" /tmp/apmode.log
          # The AP product image embeds the CYW43455 firmware (licensed blobs, gitignored, staged on the
          # build host by cm5-boot/stage-wifi-firmware.sh). CI only proves the flavor COMPILES, so it stages
          # labelled placeholders — never a flashable image (the factory refuses to sign without real blobs).
          mkdir -p firmware/brcm
          for f in cyw43455-sdio.bin cyw43455-sdio.clm_blob cyw43455-sdio-cm5.nvram.txt; do
            [ -e "firmware/brcm/$f" ] || echo "CI-PLACEHOLDER-NOT-FIRMWARE" > "firmware/brcm/$f"
          done
          cargo build -p kernel --features hboot,apmc,wifi-bigtx,appersist --release
          if grep -rnE 'const [A-Z_]*(PSK|PASS)[A-Z_]*: &\[u8\] = b"' kernel/src arch-aarch64/src; then
            echo "FATAL: Wi-Fi credential literal in kernel source — use build-time env (ADR 0045)"; exit 1
          fi

  # ---------------------------------------------------------------------------
  # End-to-end (ADR 0047): real attack traffic -> heqk IPS -> evidence -> heqk's own HTTP(S) API -> the
  # Mission Control UI in a real browser, all under QEMU. A skipped browser leg FAILS this job (the script
  # itself never silently passes; CI additionally refuses the API-only result).
  heqk-mc-e2e:
    name: "heqk Mission Control end-to-end (QEMU + Chromium)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none-softfloat
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: os/kernel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install qemu + FAT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm dosfstools mtools
      - name: Install the e2e browser (Playwright Chromium)
        working-directory: os/kernel/tools/mc-e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: mc-e2e.sh (API + TLS + browser legs)
        working-directory: os/kernel
        run: |
          set -o pipefail
          tools/mc-e2e.sh 2>&1 | tee /tmp/mc-e2e.out
          if grep -q "BROWSER LEG SKIPPED" /tmp/mc-e2e.out; then echo "FATAL: the browser leg did not run"; exit 1; fi

# -----------------------------------------------------------------------------
# NOT wired here, deliberately (M1 scope discipline — don't over-scope the
# beachhead):
#
#   os/build/make-cm5-heqk-image.sh — the signed heqk8.img image-build seam.
#   It calls os/kernel/cm5-boot/mkimage-hboot.sh, which shells out to a
#   SEPARATE `heqk-sign` binary + a KEYDIR of real ML-DSA/Ed25519 signing
#   material (default $HOME/heqk-sign) that must never live in this repo or
#   in CI (canon: "signing keys never land on devices or in the repo"). CI
#   has neither the heqk-sign binary nor any key material, so this script
#   cannot run here as-is — running it unsigned/dev-keyed would blur the
#   signing/trust-store boundary (Amber territory: operator-reviewed, not a
#   green-lane CI job). A follow-up "image-build smoke" job is plausible
#   ONLY as an explicit unsigned-artifact dry run (e.g. a --allow-unsigned /
#   --skip-sign escape hatch added to make-cm5-heqk-image.sh, gated behind
#   workflow_dispatch, never on push/PR) — proposed here, not implemented.
# -----------------------------------------------------------------------------
