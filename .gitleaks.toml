# =============================================================================
# .gitleaks.toml — HookProbe OS secrets-gate config (ADR 0046 D5).
# =============================================================================
# EXTENDS gitleaks' default ruleset (do not replace it) and adds a TIGHT,
# path-scoped allowlist for the small number of things in this tree that look
# like secrets but are verified-safe. Keep this list short; every entry below
# must be commented with WHY it is safe, and scoped as narrowly as gitleaks
# allows (path/regex, never a blanket rule-disable) so a genuine new leak is
# never masked by an over-broad allowlist.
#
# Format: gitleaks v8 — ONE [allowlist] table with `paths` (file-path regexes).
# (The previous `[[allowlist.paths]]` array-of-tables form is not valid gitleaks
# config: the CLI refused to load it — "AllowList.Paths[0] expected type string".)
# Verify locally:  podman run --rm -v "$PWD:/repo:ro,Z" -w /repo \
#   ghcr.io/gitleaks/gitleaks:v8.30.1 dir --config .gitleaks.toml .
#
# Consumed by:
#   .github/workflows/secrets-scan.yml       (gitleaks CLI, CI gate)
#   tools/build/git-hooks/pre-push           (local grep tripwire mirrors the same
#                                             patterns/intent, pure grep — see that
#                                             script's header)
# =============================================================================

title = "HookProbe OS gitleaks config"

[extend]
# Pull in gitleaks' full built-in ruleset (generic API keys, cloud-provider
# keys, PEM headers, JWTs, etc.) -- this file only ADDS allowlist entries, it
# never narrows or replaces the default detectors.
useDefault = true

[allowlist]
description = "Verified-safe, path-scoped exceptions (each one justified below)"
paths = [
  # (a) Public key material -- any *.pub file, or any *.pem with "public" in its
  # name. Public keys are meant to be public (trust stores and release-verification
  # keys are baked into shipped images on purpose). Mirrors .gitignore's own
  # `!**/*.pub` / `!**/*public*.pem` exceptions on the tracking side.
  '''.*\.pub$''',
  '''.*public.*\.pem$''',

  # (b) legacy/linux-tier/builder/release.key(.mldsa) -- the DETERMINISTIC dev
  # module-signing key (docs/adr/0046-github-migration-and-key-custody.md,
  # "Deterministic dev release-signing key"; derived in
  # legacy/linux-tier/crates/hookprobe-manifest/src/module_sig.rs from
  # Sha256("hookprobe-dev-release-key-v1")). PUBLIC-BY-DESIGN: anyone can regenerate
  # the byte-identical key from that published constant. It was also purged from
  # history (2026-07-25) and .gitignore keeps it untracked, so normally this entry
  # matches nothing; it exists so an accidentally staged dev key fails review on
  # "should not be committed" grounds rather than as a misleading "leaked secret"
  # that would trigger a rotation fire-drill for a key that was never secret.
  # Production signing NEVER uses it (HSM keys + cosign keyless only, ADR 0002/0046).
  '''^legacy/linux-tier/builder/release\.key$''',
  '''^legacy/linux-tier/builder/release\.key\.mldsa$''',
]
# (c) Cargo.lock dependency lists naming the `libcrux-secrets` crate: generic-api-key reads
# "secrets" as a keyword and the NEXT package name ("libcrux-sha3") as its value. Matched on the
# whole finding (keyword line + a libcrux-* crate name), so a real key in a lockfile still fires.
# Source: os/build/kem-diff{,/nostd-check}/Cargo.lock (host-only ML-KEM evaluation, ADR 0052 G4).
regexTarget = "match"
regexes = [
  '''libcrux-secrets",\s+"libcrux-[a-z0-9-]+"''',
  # (d) PEM armour NAMED or BUILT in source code, not key material, e.g. os/mission-control/src/store/signing.ts:
  # an error message quoting the header (`"-----BEGIN PRIVATE KEY-----")`) and the backup export template
  # (`-----BEGIN PRIVATE KEY-----\n${b64}…`). Allowed only when the header is directly followed by a closing
  # quote/backtick/paren or by a `${` template placeholder. A real key is always followed by a line break or
  # `\n` and base64, so a pasted real key still fires (verified with gitleaks v8.30.1 on generated keys).
  '''-----BEGIN [A-Z ]*PRIVATE KEY-----(["'`)\]]|(\\n|\s)*\$\{)''',
]
