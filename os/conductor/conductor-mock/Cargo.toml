# Host-only C0 test bench: a mock kernel (signer, tool executor, driver loop) and a scripted mock worker,
# plus the C0 gate tests, the fuzz harness and the measurement tool. Never part of a device image.
[package]
name = "conductor-mock"
version = "0.0.26"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
neuro-contract = { path = "../neuro-contract" }
conductor-core = { path = "../conductor-core", features = ["signer"] }
conductor-worker = { path = "../conductor-worker" }

[dev-dependencies]
conductor-p0 = { path = "../conductor-p0" }
neuro-gguf = { path = "../neuro-gguf" }
neuro-hnx = { path = "../neuro-hnx" }
neuro-lm = { path = "../neuro-lm" }
neuro-kernels = { path = "../neuro-kernels" }
tok-build = { path = "../tok-build" }
