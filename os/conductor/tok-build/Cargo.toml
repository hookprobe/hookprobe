# tok-build: BUILD-HOST ONLY. Turns a model's tokenizer definition into the table blob that
# `neuro_lm::tok` validates and runs on the device. The Unicode tables come from Rust crates here (the
# device has none). Never a dependency of a device binary. No Python: the reference implementation the
# tests compare against is HF `tokenizers` (Rust), on its pure-Rust regex backend.
[package]
name = "tok-build"
version = "0.0.26"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
neuro-lm = { path = "../neuro-lm" }
neuro-contract = { path = "../neuro-contract" }
neuro-gguf = { path = "../neuro-gguf" }
neuro-kernels = { path = "../neuro-kernels" }
neuro-build = { path = "../neuro-build" }
neuro-hnx = { path = "../neuro-hnx" }
# `hnx-lm job` only: the device harness, the capability protocol and the worker, around the engine.
conductor-core = { path = "../conductor-core" }
conductor-worker = { path = "../conductor-worker" }
conductor-p0 = { path = "../conductor-p0" }
conductor-engine-entry = { path = "../engine-entry" }
conductor-mock = { path = "../conductor-mock" }
ed25519-compact = "=2.3.1"
serde_json = "1"
sha2 = "=0.10.9"
regex = "1"
unicode-normalization = "0.1"

[dev-dependencies]
fancy-regex = "0.14"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
