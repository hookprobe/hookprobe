# Self-contained build config for the detached worker-engine crate (built by the kernel's build.rs in a CLEAN env).
# HARD-FLOAT target on purpose: the engine uses NEON (and SDOT where the CPU has DotProd). It only ever runs on a
# worker core that enabled FP/SIMD for itself; the kernel image stays softfloat.
[build]
target = "aarch64-unknown-none"

[unstable]
build-std          = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
