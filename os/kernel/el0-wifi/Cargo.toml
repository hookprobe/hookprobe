# ADR 0065 — el0-wifi, the resident EL0 Wi-Fi driver server (step 2: drives a fake device in QEMU).
# A detached crate (own [workspace]) built by the kernel build.rs like el0-hsh; allocation-free.
[package]
name = "el0-wifi"
version = "0.0.26"
edition = "2021"
publish = false  # first-party: never published to crates.io (ADR 0063 G4)
license = "AGPL-3.0-only"

[workspace]

[[bin]]
name = "el0-wifi"
path = "src/main.rs"

[features]
cm5 = []

[dependencies]
hal = { path = "../hal" }
# ADR 0065 step 3c: the WPA3-SAE responder (curve + KDF) runs here with its secrets (operator D3)
sae = { path = "../sae" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
