[all]
BOOT_UART=1
POWER_OFF_ON_HALT=1
# P9 (Path A): train the external PCIe RC1 (RTL8111H / eth1) in the bootloader
# before OS handoff, so HEQK finds the NIC link already up at 01:00.0.
PCIE_PROBE=1

# Boot Order Codes, from https://www.raspberrypi.com/documentation/computers/raspberry-pi.html#BOOT_ORDER
# Try SD first (1), followed by, USB PCIe, NVMe PCIe, then network
BOOT_ORDER=0xf2461
