# HookProbe microkernel — Cargo workspace (see buildPlan.md §2, ARCHITECTURE.md §1).
# Layout: kernel (bin + agnostic logic) · hal (traits) · arch-aarch64 (impl) · abi (shared).
[workspace]
resolver = "2"
members = ["kernel", "hal", "arch-aarch64", "abi", "hboot", "boot-abi", "sae"]

# Bare-metal: no unwinding runtime — panic must abort.
[profile.dev]
panic = "abort"

# The shared SHA-256 / boot verifier optimised even in debug (validate.sh) builds: the OTA self-tests hash
# real-size (3-5 MB) images many times under QEMU TCG — unoptimised that took ~300 s of a 300 s budget.
[profile.dev.package.boot-abi]
opt-level = 3

# The SAE curve arithmetic (P-256) optimised in debug builds too: [P-sae] and [P-lansvc-sae] (mc-e2e) run several
# full SAE exchanges under QEMU TCG; unoptimised field arithmetic makes each one seconds long.
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.release]
panic = "abort"
lto = true
