[package]
name = "sae"
version = "0.1.0"
edition = "2021"
publish = false  # first-party: never published to crates.io (ADR 0063 G4)

[dependencies]
# ADR 0050 D4 step 5c: the station-frame walk (hal::saewire) — shared with el0-lansvc, no curve library there
hal = { path = "../hal" }
# p256 0.14 (crypto-bigint 0.7: RUSTSEC-2026-0387). The field type is no longer re-exported by p256; it is named
# through elliptic_curve::FieldArithmetic, with arithmetic via the ff traits.
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6", default-features = false }

[dev-dependencies]
aes = "0.8.4"
