# ADR 0065 step 4g (S1): el0-wpa, the resident EL0 WPA security server (4-way, SAE, PMKSA — moved in from el0-wifi in
# S2). A detached crate (own [workspace]) built by the kernel build.rs like el0-wifi; allocation-free.
[package]
name = "el0-wpa"
version = "0.0.26"
edition = "2021"
publish = false  # first-party: never published to crates.io (ADR 0063 G4)
license = "AGPL-3.0-only"

[workspace]

[[bin]]
name = "el0-wpa"
path = "src/main.rs"

[features]
cm5 = []

[dependencies]
hal = { path = "../hal" }
# S2: the WPA3-SAE responder (curve + KDF) runs here with its secrets (operator D3 + the 2026-11-15 split)
sae = { path = "../sae" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
