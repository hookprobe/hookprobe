  <text x="700" y="1100" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#7d7d90">underneath: Wi-Fi 7 · 5G · NVMe · accelerator  —  illustration, not the board layout</text>
