<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" role="img" aria-labelledby="t d">
  <title id="t">HookProbe board (illustration, not the board layout)</title>
  <desc id="d">Every port on one edge: a DC jack, two 2.5 gigabit Ethernet jacks, two USB-C and a stacked USB-A. A heatsink with a fan covers the RK3588 processor and memory. Wi-Fi 7, 5G, NVMe and an accelerator sit underneath on M.2 cards.</desc>
