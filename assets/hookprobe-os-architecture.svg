<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">HookProbe OS architecture</title>
  <desc id="description">Network and device signals feed a local HookProbe OS running on the heqk microkernel. A shared evidence graph powers Mission Control workspaces. A signed platform manifest gates capabilities, and fleet enrollment is optional.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#17283c"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b55"/>
      <stop offset="1" stop-color="#14504f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6ee7d2"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#91a8c0"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #8ea8c0; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .title { fill: #f3f7fb; font-size: 27px; font-weight: 700; }
      .label { fill: #e7f0f7; font-size: 17px; font-weight: 650; }
      .copy { fill: #adc0d1; font-size: 14px; }
      .tiny { fill: #91a8c0; font-size: 12px; }
      .card { fill: #1b2c40; stroke: #344a61; stroke-width: 1.5; }
      .inner { fill: #1b344a; stroke: #3a647a; stroke-width: 1.3; }
      .line { fill: none; stroke: #6ee7d2; stroke-width: 2.4; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #91a8c0; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="url(#background)"/>
  <circle cx="1060" cy="90" r="180" fill="#246174" opacity=".12"/>
  <circle cx="150" cy="575" r="190" fill="#268f89" opacity=".08"/>

  <text x="54" y="52" class="eyebrow">HOOKPROBE OS · ONE LOCAL SYSTEM</text>
  <text x="54" y="88" class="title">Signals become evidence. Evidence powers every workspace.</text>

  <rect x="440" y="116" width="320" height="68" rx="14" class="card"/>
  <text x="600" y="144" text-anchor="middle" class="label">Signed Platform Manifest</text>
  <text x="600" y="166" text-anchor="middle" class="copy">The capability source of truth</text>
  <path d="M600 184V213" class="line"/>

  <rect x="42" y="245" width="210" height="166" rx="18" class="card"/>
  <text x="68" y="280" class="eyebrow">INPUTS</text>
  <text x="68" y="316" class="label">Network traffic</text>
  <text x="68" y="345" class="copy">Packets · flows</text>
  <text x="68" y="372" class="label">Device signals</text>
  <text x="68" y="397" class="copy">Events · telemetry</text>

  <rect x="304" y="210" width="592" height="302" rx="22" fill="url(#kernel)" stroke="#4aa89d" stroke-width="2"/>
  <text x="336" y="249" class="eyebrow">ON THE DEVICE</text>
  <text x="336" y="280" class="title">heqk · HookProbe OS</text>
  <text x="336" y="303" class="copy">Detection and response · local services · device-served Mission Control</text>

  <rect x="344" y="330" width="250" height="132" rx="14" class="inner"/>
  <text x="469" y="362" text-anchor="middle" class="label">Shared evidence graph</text>
  <text x="469" y="389" text-anchor="middle" class="copy">Events · connections · threats</text>
  <text x="469" y="414" text-anchor="middle" class="copy">Incidents · responses · reports</text>
  <text x="469" y="442" text-anchor="middle" class="tiny">One linked trail from signal to decision</text>

  <rect x="625" y="330" width="231" height="132" rx="14" class="inner"/>
  <text x="740" y="362" text-anchor="middle" class="label">Mission Control</text>
  <text x="740" y="389" text-anchor="middle" class="copy">Observe · Detect · Investigate</text>
  <text x="740" y="414" text-anchor="middle" class="copy">Protect · Intelligence · more</text>
  <text x="740" y="442" text-anchor="middle" class="tiny">Workspaces are views of the same system</text>

  <path d="M252 328H326" class="line"/>
  <path d="M594 396H614" class="line"/>

  <rect x="944" y="264" width="216" height="148" rx="18" class="card"/>
  <text x="1052" y="300" text-anchor="middle" class="eyebrow">OPTIONAL</text>
  <text x="1052" y="333" text-anchor="middle" class="label">Fleet control plane</text>
  <text x="1052" y="361" text-anchor="middle" class="copy">Enrollment · fleet operations</text>
  <text x="1052" y="385" text-anchor="middle" class="tiny">Not required for local operation</text>
  <path d="M896 370H934" class="optional"/>

  <rect x="42" y="548" width="1118" height="60" rx="15" fill="#1b2c40" stroke="#344a61" stroke-width="1.5"/>
  <text x="68" y="574" class="eyebrow">PLATFORM CAPABILITIES</text>
  <text x="68" y="596" class="copy">Hardware unlocks capabilities; it does not define a separate product.</text>
  <text x="1135" y="584" text-anchor="end" class="label">CM5 validated · QEMU development</text>
</svg>
