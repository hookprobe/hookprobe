[workspace]
members = [
    "crates/hookprobe-manifest",
    "crates/hookprobe-evidence",
    "crates/hookprobe-exploit",
    "crates/hookprobe-hydra",
    "crates/hookprobe-dns-sinkhole",
    "crates/hookprobe-api",
    "crates/hookprobe-mgmt-guard",
    "crates/hookprobe-planner",
    "crates/hookprobe-rbac",
    "modules/host-telemetry/loader",
    "bootstrap",
    "supervisor",
    "modules/dnsxai",
    "modules/qsecbit",
    "modules/dga-lm",
    "modules/aegis-guard",
    "modules/napse",
    "modules/napse-capture/loader",
    "modules/napse-quarantine/loader",
    "modules/napse-l2guard/loader",
    "modules/sigma",
    "modules/yara-scan",
    "security/redteam/engine",
]
# ADR 0043 / Phase M1: the heqk microkernel substrate lives at kernel/heqk as its OWN
# nightly no_std / build-std / aarch64-none-softfloat Cargo workspace (its rust-toolchain.toml
# + .cargo/config are scoped to that dir). Exclude it so this stable/Wasm root workspace never
# tries to absorb its crates. heqk is built by-reference from builder/make-cm5-heqk-image.sh.
exclude = ["kernel/heqk"]
resolver = "2"

# Release profile for Wasm modules: size-optimised, no unwinding code.
# Applies to all workspace members (including modules/dnsxai).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
