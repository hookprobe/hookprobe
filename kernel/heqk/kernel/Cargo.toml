[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
hal          = { path = "../hal" }
arch-aarch64 = { path = "../arch-aarch64" }
abi          = { path = "../abi" }
boot-abi     = { path = "../boot-abi" }
# Runtime attestation service (B-2): the kernel signs verifier-supplied
# challenge nonces with a per-boot EPHEMERAL ed25519 key (fast/small — no
# SLH-DSA in the kernel; the device AK stays in HBoot). Bare-metal, no std/RNG.
ed25519-compact = { version = "2", default-features = false }

[features]
# Build for real hardware (Raspberry Pi CM5 / BCM2712): switches peripheral
# addresses + linker load address, and boots a minimal serial "hello" first.
cm5 = ["arch-aarch64/cm5"]
# Launched by HBoot (heqk-boot): link at 0x1000000, enter at EL1 with console
# already up, consume the typed BootInfo handoff.
hboot = ["cm5", "arch-aarch64/hboot"]
# P10-BT (CYW43455 Bluetooth over HCI-UART). OFF BY DEFAULT.
# METAL 2026-07-24: the BT core did not answer HCI Reset and the probe left a
# DEFERRED EXTERNAL ABORT that surfaced as SError/Lower64 (EC=0x2f) at the next
# EL0 entry, killing the following P7c stage. uarta evidently needs clock/power
# sequencing HEQK does not yet do. Until that is understood, BT must not be able
# to poison later phases.
#   re-enable with: cargo build -p kernel --features hboot,p10bt --release
p10bt = []  # PROVEN on metal 2026-07-24: reset+baud ok, 17 BLE devs; kept opt-in-buildable

[[bin]]
name = "kernel"
path = "src/main.rs"
