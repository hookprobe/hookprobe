[package]
name = "arch-aarch64"
version = "0.1.0"
edition = "2021"

[dependencies]
hal = { path = "../hal" }

[features]
cm5 = [] # BCM2712 (Pi CM5) peripheral addresses instead of QEMU virt
hboot = ["cm5"] # entered by HBoot (heqk-boot) at EL1, console already up
# P15 eMMC WRITE path — OFF by default (read-only, no brick risk). The only
# sectors ever writable are 2016..2047; LBA 0 + partitions are never touched.
p15-write = []
