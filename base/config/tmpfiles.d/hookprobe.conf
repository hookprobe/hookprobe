# hookprobe.conf — systemd-tmpfiles: create the data-partition mountpoint, its
# subdirs, and the runtime socket dir. The persistent dirs live UNDER the mounted
# /var/lib/hookprobe data partition (created if the partition is fresh); /run dirs
# are tmpfs and recreated every boot.
#
# Type  Path                              Mode  User       Group      Age  Argument

# Mountpoint for the persistent data partition (var-lib-hookprobe.mount targets it).
d  /var/lib/hookprobe                     0750  hookprobe  hookprobe  -

# Persistent state laid out by tier (ADR 0003 retention tiers + module/manifest state).
d  /var/lib/hookprobe/manifest            0750  hookprobe  hookprobe  -
d  /var/lib/hookprobe/modules             0750  hookprobe  hookprobe  -
d  /var/lib/hookprobe/flows               0750  hookprobe  hookprobe  -
d  /var/lib/hookprobe/events              0750  hookprobe  hookprobe  -
d  /var/lib/hookprobe/dns                 0750  hookprobe  hookprobe  -
d  /var/lib/hookprobe/pcap                0750  hookprobe  hookprobe  -
d  /var/lib/hookprobe/evidence            0750  hookprobe  hookprobe  -
# Secrets stay OFF the image, on the data partition, sealed to TPM where present
# (Readme "Secrets stay off the image"). Tight perms.
d  /var/lib/hookprobe/secrets             0700  hookprobe  hookprobe  -

# HYDRA's IntelOnly verdict sidecar (ADR 0023 task #19 / ADR 0027 Layer-1; 2026-07-16
# security-auditor AMBER-2): hookprobe-supervisor trusts its `enforce`/`corroborated` bit as
# untrusted-provenance IntelOnly trust input (the mgmt floor in `trust::build_posture` is the
# PRIMARY backstop against a forged/compromised file — this is defense-in-depth on top of that).
# root:root 0600 so only the root-run hookprobe-hydra.service (UMask=0177) can write it; `z`
# re-asserts ownership/mode on every boot/upgrade in case an older image left it looser. Written
# by the unit itself, not pre-created here — a device before HYDRA's first run has no file at all,
# which the supervisor already treats as zero intel signals.
z  /var/lib/hookprobe/hydra-verdicts      0600  root       root       -

# Runtime socket dir (RO manifest socket + RW control socket live here). tmpfs.
d  /run/hookprobe                         0755  hookprobe  hookprobe  -
