# mkosi project — build a BOOTABLE Debian VM image of HookProbe OS (boot-first; no bootc
# yet). The Arch/mkosi way: only what we need. Reuses the repo's binaries/units/scripts via
# mkosi.extra/ (populated by build-vm.sh) and adds the boot delta Debian apt provides
# (kernel + systemd-boot + dracut). Output: a bootable disk image to boot in qemu-kvm.
#
#   builder/mkosi/build-vm.sh            # populate + build + (qemu) boot + smoke test
[Distribution]
Distribution=debian
# bookworm (not trixie) for the VM build: mkosi 20.2's hardcoded bootable-image package
# list predates Debian's 64-bit-time_t (t64) library renames in trixie. The HookProbe
# binaries are static-musl, so they don't care about the VM's glibc/distro version — this
# is purely the boot-substrate choice for the throwaway VM. (The OCI/bootc image is trixie.)
Release=bookworm

[Output]
Format=disk
ImageId=hookprobe-os

[Content]
Bootable=yes
Bootloader=systemd-boot
# Serial console so qemu captures all boot + journal output; rw root (no bootc immutability
# yet); forward the journal to the console so the boot chain is visible without logging in.
# ONLY ttyS0 so ALL output (kernel + userspace /dev/console: firstboot, the self-test
# verdict) lands on the captured serial. With a second `console=tty0`, tty0 would become
# the primary /dev/console and userspace output would go there (invisible to us).
# systemd.firstboot=off is ESSENTIAL for a headless appliance: without it, the first-boot
# wizard runs `systemd-firstboot --prompt-locale --prompt-timezone --prompt-root-password`
# and BLOCKS on interactive input that never comes — deadlocking sysusers → udevd → every
# device → the whole boot (diagnosed via systemd.log_level=debug). We provision unattended.
# systemd.unified_cgroup_hierarchy=1 + psi=1 mirror base/config/kargs.d/10-hookprobe.toml (the
# bootc-tier kargs source of truth) — the two-wall resource-budget model (Architecture C11:
# cgroups v2 CPUQuota/MemoryHigh outer wall + PSI-driven throttle/pause/evict) needs both.
# Defensive assertion, not a new dependency: modern systemd/kernel default to both already, but
# a mismatch here would silently degrade the budget contract with no loud error (2026-07-07
# build-path parity fix — was bootc-only before).
KernelCommandLine=console=ttyS0 systemd.journald.forward_to_console=1 systemd.firstboot=off systemd.unified_cgroup_hierarchy=1 psi=1 rd.systemd.show_status=auto rw
# RELEASE SECURITY FIX (2026-07-07, backend audit F1/F2 — twin of the builder/mkosi-arm64 fix):
# this base rootfs must be born CLEAN. Autologin=yes + a static RootPassword= here meant EVERY
# amd64 image shipped a root console shell reachable with zero credentials (Autologin) and a
# known password (RootPassword) regardless of who booted it. Root's shadow entry is now decided
# entirely by mkosi.postinst's HOOKPROBE_DEBUG_ACCESS gate (mirrors mkosi-arm64); the console
# AUTOLOGIN getty unit is staged by build-vm.sh into mkosi.extra/ instead (same env var) because
# mkosi.postinst's sandboxed script execution presents /usr as a READ-ONLY overlay whenever a
# package-manager cache tree exists (see mkosi.postinst for the mechanism) — it cannot write a
# new /usr/lib/systemd/system/*.d/ unit file, the same reason the /usr/bin symlinks are
# pre-baked in build-vm.sh rather than fixed up in postinst. `Environment=NAME` (no `=value`) is
# mkosi's "pass this var through from the calling shell" form.
Environment=HOOKPROBE_DEBUG_ACCESS
Packages=
        systemd
        systemd-boot
        systemd-sysv
        systemd-resolved
        udev
        dbus
        passwd
        linux-image-amd64
        # initramfs-tools (Debian-native, pulled by linux-image-amd64) instead of dracut:
        # a real-boot test showed the dracut initrd doesn't hand udev off to the real root
        # (systemd-udevd stops at switch-root + never restarts → no device events). The
        # native initrd does the handoff correctly.
        initramfs-tools
        iproute2
        iputils-ping
        jq
        ca-certificates
        util-linux
        gdisk
        parted
        cloud-guest-utils
        e2fsprogs
        kmod
        # Data-at-rest: LUKS/plain dm-crypt (ADR 0007). firstboot-provision-data.sh calls
        # `cryptsetup` to open the data volume; without it firstboot-data exits 127 and the whole
        # self-provision chain cascades (manifest never written → SOC never comes up). Kept in
        # lockstep with builder/mkosi-arm64/mkosi.conf so amd64 and arm64 provision identically.
        cryptsetup
        cryptsetup-initramfs
        clevis
        clevis-luks
        clevis-tpm2
        clevis-initramfs
        tpm2-tools
        openssl
        # Fabric dataplane (build-path parity fix, 2026-07-07 -- was MISSING from this amd64/VM
        # image entirely, unlike builder/mkosi-arm64/mkosi.conf and base/Containerfile Layer A,
        # both of which already carry it): nftables = L3 VRF cross-segment enforcement +
        # microseg/NAC/WAN-allowlist/quarantine rules; openvswitch-switch = L2 OVS bridge/
        # OpenFlow microseg. NOT Wi-Fi/hardware-specific -- the reconciler
        # (crates/hookprobe-manifest/src/nac.rs et al.) unconditionally emits `nft`/`ovs-*`
        # commands whenever capture/openvswitch/nac are granted, on ANY platform including a
        # plain amd64 VM/cloud-amd64/generic node. Without these tools those calls exit 127
        # SILENTLY (the reconciler logs but does not hard-fail) -- exactly the "hollow
        # enforcement" class of bug already fixed once for bootc; this closes the amd64-mkosi
        # instance of the same gap.
        nftables
        openvswitch-switch
        # PTP (IEEE-1588) time-truth userspace (base-tier-build-ticket.md Phase 3; ADR 0031 §B):
        # ptp4l + phc2sys, ExecCondition-gated on the `ptp_hw` capability by their own units
        # (base/units/hookprobe-ptp4l.service, hookprobe-phc2sys.service) -- dormant/no-op here
        # until a real per-board macb-hw-timestamping scan fact lands.
        linuxptp
