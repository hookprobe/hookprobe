# mkosi project — build a BOOTABLE arm64 (aarch64) Debian image of HookProbe OS, the Pi 4
# target. Mirrors builder/mkosi/ (amd64) with the arch delta + the Pi-relevant firmware:
#   - Architecture=arm64, linux-image-arm64
#   - non-free-firmware repo + the Wi-Fi firmware bundle (brcm/realtek/atheros/mediatek) so
#     onboard + common USB dongle radios work OUT OF THE BOX (see docs/architecture/driver-strategy.md).
#   - out-of-tree Realtek USB-dongle .ko modules are CROSS-BUILT on the host and staged into
#     mkosi.extra/ by build-arm64.sh (NOT here — emulated in-chroot builds are too slow).
#
# THREE boot substrates share this one rootfs (ADR 0019 D2, refined by ADR 0029 D2 — corrected
# 2026-07-08, this comment previously claimed real Pi hardware used UEFI/systemd-boot, which is
# NOT what make-pi4-image.sh/make-pi-image.sh actually do):
#   - qemu-virt (THIS mkosi image, UEFI/AAVMF + systemd-boot) → fast arm64 proof: boot-arm64.sh
#   - arm64-UEFI/virt cloud/VM targets (same systemd-boot image, Debian kernel — ADR 0019/0029 D2)
#   - real Raspberry Pi (Pi4/CM4/Pi5/CM5) → NOT UEFI: MBR + FAT32 `config.txt` + SoC EEPROM
#     direct-kernel-load, using the Raspberry-Pi-repo downstream kernel(s), NOT this image's own
#     Debian kernel/UKI (which stays qemu-virt/UEFI-only) — see builder/mkosi-arm64/
#     make-pi-image.sh (ADR 0029, the unified Pi4/CM4/Pi5/CM5 fat-boot factory) and
#     docs/adr/0029-unified-pi-fatboot-dual-kernel.md. This mkosi build still supplies the
#     ROOTFS make-pi-image.sh consumes (userspace/modules/trust store) — only the kernel + boot
#     wrapper differ per substrate.
#
#   builder/mkosi-arm64/build-arm64.sh        # populate mkosi.extra + cross-build drivers
#   (cd builder/mkosi-arm64 && sudo mkosi --force build)
[Distribution]
Distribution=debian
# bookworm (not trixie): same reason as amd64 — mkosi 20.2's hardcoded bootable-image
# package list predates Debian's t64 library renames in trixie. The HookProbe binaries are
# static-musl (arch-pinned, distro-agnostic), so this is only the boot-substrate choice.
Release=bookworm
Architecture=arm64
# non-free-firmware carries the Wi-Fi/BT firmware blobs (Pi onboard brcmfmac, Realtek/
# Atheros/MediaTek USB dongles). Without it the radios enumerate but never associate.
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
ImageId=hookprobe-os-arm64

[Content]
Bootable=yes
Bootloader=systemd-boot
# arm64 virt + Pi 4 both expose the PL011 UART as ttyAMA0 (NOT ttyS0 like x86). Only ONE
# console= so userspace /dev/console (firstboot, the self-test verdict) lands on the serial
# we capture. systemd.firstboot=off: headless appliance must never run the interactive
# locale/timezone/root-password wizard (it deadlocks sysusers→udevd→boot — see amd64 notes).
# systemd.unified_cgroup_hierarchy=1 + psi=1 mirror base/config/kargs.d/10-hookprobe.toml (the
# bootc-tier kargs source of truth) — the two-wall resource-budget model (Architecture C11:
# cgroups v2 CPUQuota/MemoryHigh outer wall + PSI-driven throttle/pause/evict) needs both.
# Defensive assertion, not a new dependency: modern systemd/kernel default to both already, but
# a mismatch here would silently degrade the budget contract with no loud error (2026-07-07
# build-path parity fix — was bootc-only before).
KernelCommandLine=console=ttyAMA0 systemd.journald.forward_to_console=1 systemd.firstboot=off systemd.unified_cgroup_hierarchy=1 psi=1 rd.systemd.show_status=auto rw
# RELEASE SECURITY FIX (2026-07-07, backend audit F1/F2): this base rootfs must be born
# CLEAN — no unconditional root password, no console autologin. Autologin=yes + a static
# RootPassword= here meant EVERY arm64 image (not just an unhardened Pi 4 .img) shipped a
# root shell with a known password reachable from the console with zero credentials, and
# `root:hookprobe` over SSH once sshd came up — independent of mkosi.postinst or
# make-pi4-image.sh's release branch ever running. Root's shadow entry and any debug SSH
# access are now decided ENTIRELY by mkosi.postinst's HOOKPROBE_DEBUG_ACCESS gate (mirrors
# make-pi4-image.sh's own gate) — default (unset) = root LOCKED, no autologin, no debug user.
# `Environment=NAME` (no `=value`) is mkosi's "pass this var through from the calling shell"
# form (see mkosi.postinst / RUNBOOK for the debug-build invocation).
Environment=HOOKPROBE_DEBUG_ACCESS
Packages=
        systemd
        systemd-boot
        systemd-sysv
        systemd-resolved
        udev
        dbus
        passwd
        # Boot splash (display-equipped units); headless units use the /etc/issue console banner.
        plymouth
        # Data-at-rest: LUKS2 + dm-verity (cryptsetup), capability-driven auto-unlock (clevis). Tang
        # (network) unlock is additive; a local pin / recovery slot keeps standalone devices bootable.
        cryptsetup
        cryptsetup-initramfs
        clevis
        clevis-luks
        clevis-tpm2
        clevis-initramfs
        # TPM2 userspace so systemd-creds --with-key=tpm2 works (E3 key-anchor TPM tier on N100/CM5/HAT
        # boards; bare boards self-detect the software anchor + don't need it). openssl for passphrase tier.
        tpm2-tools
        openssl
        linux-image-arm64
        # Debian-native initrd (does the udev→real-root handoff correctly; dracut did not).
        initramfs-tools
        # zstd: this arm64 kernel only supports zstd-compressed initrds (CONFIG_RD_GZIP off),
        # so initramfs-tools needs the zstd CLI to (re)build the initrd — incl. on-device after
        # a kernel update, and for the Pi4 initrd regen in make-pi4-image.sh.
        zstd
        # Wi-Fi/BT firmware bundle — onboard Pi radio + common USB dongles (Tier 1, in-kernel
        # drivers + these blobs = out-of-box). See docs/architecture/driver-strategy.md supported matrix.
        firmware-brcm80211
        firmware-realtek
        firmware-atheros
        firmware-misc-nonfree
        iw
        wireless-regdb
        # hostapd: serve the built-in radio as the AP (the trusted Wi-Fi bubble). wifi_cfg
        # generates /etc/hostapd/hostapd-<iface>.conf; hookprobe-hostapd@<iface> runs it.
        hostapd
        # wpasupplicant: STATION-role uplink ONLY (a USB Wi-Fi dongle used as the WAN, per the
        # SASE portable-edge model). It is NEVER run on an AP-role radio — the onboard brcmfmac
        # AP "VHT80 collapse" was root-caused (ADR 0034) to wpa_supplicant scanning the AP radio
        # and yanking hostapd off-channel, so 80-hookprobe.preset masks wpa_supplicant.service by
        # default and the reconciler starts a supplicant instance ONLY for a station-role iface.
        # Present-but-masked = station mode works out-of-box when a dongle is plugged, with zero
        # risk to the AP. (Closes the v1 station-mode package gap.)
        wpasupplicant
        # Cellular / USB 5G-LTE modem detection (SASE wwan uplink): ModemManager enumerates a
        # plugged USB modem (mmcli), libmbim/libqmi drive MBIM/QMI modems, usb-modeswitch flips
        # combo dongles out of storage mode. cellular-connect.sh connects one when present.
        modemmanager
        libmbim-utils
        libqmi-utils
        usb-modeswitch
        # DEBUG access for first-hardware-boot (see mkosi.postinst): sshd + a login user so the
        # Pi 4 is reachable over the LAN after it DHCPs. Debug-only — password auth + root login.
        openssh-server
        sudo
        iproute2
        iputils-ping
        # Fabric dataplane: nftables = L3 VRF cross-segment enforcement + microseg rules;
        # openvswitch-switch = L2 OVS bridge/OpenFlow microseg (multi-LAN-port edges). The
        # reconcile emits these artifacts; without the tools they're staged but not applied.
        nftables
        openvswitch-switch
        # PTP (IEEE-1588) time-truth userspace (base-tier-build-ticket.md Phase 3; ADR 0031 §B):
        # ptp4l + phc2sys, disciplining the Phase-0 macb PHC (/sys/class/ptp/ptp0) behind RP1 on
        # the bcm2712 base tier. ExecCondition-gated on the `ptp_hw` capability by their own units
        # (base/units/hookprobe-ptp4l.service, hookprobe-phc2sys.service) -- dormant/no-op here
        # until a real per-board macb-hw-timestamping scan fact lands
        # (crates/hookprobe-manifest/src/capabilities.rs).
        linuxptp
        jq
        ca-certificates
        util-linux
        gdisk
        parted
        cloud-guest-utils
        e2fsprogs
        kmod
