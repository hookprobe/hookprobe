# =============================================================================
# build-modules.yml — build + sign the HookProbe LOGIC layer (Readme Pillar 2).
# =============================================================================
#
# Two artifact kinds (docs/architecture/runtime-engine-map.md; module.yaml `runtime`):
#   - WASM modules  (runtime: wasm)   → one .wasm per arch-neutral target, OCI-pushed,
#                                        cosign-signed; the supervisor verifies on load
#                                        (`signature: required`). → the Marketplace index.
#   - SYSEXT images (runtime: sysext) → host-integral kernel/eBPF bits (napse-capture);
#                                        per-arch OCI, cosign-signed, merged at boot.
#   - IMAGE-LAYER   (runtime: image-layer) → e.g. ovs: NO separate artifact; covered by
#                                        the OS image signature. Validated, not re-built.
#
# Gates: `cargo test` (workspace) + the per-module wasm build must pass before signing.
#
# HONESTY: cannot run here (no registry creds for registry.hookprobe.com, no cosign
# identity, no wasm target installed, no eBPF/CO-RE toolchain). Canonical definition;
# runs on push with secrets. Genuine unknowns marked `# TODO`.
# =============================================================================
name: build-modules

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "modules/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "security/**"
      - ".github/workflows/build-modules.yml"
  pull_request:
    paths:
      - "modules/**"
      - "crates/**"
      - ".github/workflows/build-modules.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write          # keyless cosign (or swap for a KMS credential — ADR 0002 §3)
  attestations: write

env:
  # The Marketplace / module registry. module.yaml `artifact:` points at
  # registry.hookprobe.com/modules/... (the supervisor IS the marketplace backend).
  # TODO: provide push credentials for registry.hookprobe.com (or mirror to ghcr for CI).
  MODULE_REGISTRY: registry.hookprobe.com
  WASM_TARGET: wasm32-wasip1     # one binary per arch (WASI 0.2/p1) — Pillar 2

jobs:
  # ---------------------------------------------------------------------------
  # 0) Workspace test gate — `cargo test` must pass before ANY module is signed/pushed.
  # ---------------------------------------------------------------------------
  test:
    name: "cargo test (gate)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace --locked
        # TODO: the wasm modules build for wasm32-wasip1 but their UNIT tests run on the
        #       host target (std math) — confirm each crate's tests are host-runnable, or
        #       gate per-crate with `--exclude` for any wasm-only test harness.

  # ---------------------------------------------------------------------------
  # 1) WASM modules: build (gate) → SBOM → OCI push → cosign sign + attest.
  #    Matrix = the four workspace wasm members (Cargo.toml). dnsxai/qsecbit/aegis-guard/
  #    napse. edge-ai-detector/hydra/inline-guard have module.yaml but no crate yet (TODO).
  # ---------------------------------------------------------------------------
  build-wasm:
    name: "wasm · ${{ matrix.module }}"
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [dnsxai, qsecbit, aegis-guard, napse]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      - name: Install tooling (cosign, oras, cargo-cyclonedx, yq)
        run: |
          set -euxo pipefail
          cargo install cargo-cyclonedx --locked || true   # TODO: pin version
          sudo snap install yq || sudo apt-get install -y yq || pip install yq
          curl -fsSL https://github.com/oras-project/oras/releases/latest/download/oras_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin oras
          # TODO: pin oras version + verify checksum.
      - uses: sigstore/cosign-installer@v3

      - name: Read module identity from module.yaml
        id: meta
        run: |
          set -euxo pipefail
          MY="modules/${{ matrix.module }}/module.yaml"
          ID="$(yq -r '.id' "$MY")"
          VER="$(yq -r '.version' "$MY")"
          ART="$(yq -r '.artifact' "$MY")"
          RUNTIME="$(yq -r '.runtime' "$MY")"
          test "$RUNTIME" = "wasm" || { echo "FAIL: ${MY} runtime is $RUNTIME, expected wasm"; exit 1; }
          echo "id=$ID"   >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"

      - name: Build wasm (GATE)
        run: |
          set -euxo pipefail
          cargo build --locked --release --target "${WASM_TARGET}" -p "${{ steps.meta.outputs.id }}"
          WASM="target/${WASM_TARGET}/release/${{ steps.meta.outputs.id }}.wasm"
          # crate names with '-' produce '_' in the artifact name — normalise.
          if [ ! -f "$WASM" ]; then
            WASM="target/${WASM_TARGET}/release/$(echo '${{ steps.meta.outputs.id }}' | tr '-' '_').wasm"
          fi
          test -f "$WASM" || { echo "FAIL: no wasm artifact for ${{ steps.meta.outputs.id }}"; ls -l "target/${WASM_TARGET}/release/"; exit 1; }
          cp "$WASM" "module.wasm"
          # TODO: optionally run `wasm-tools validate` + componentize to a WASI 0.2
          #       component (the modules target WIT interfaces — Pillar 2).

      - name: Per-module SBOM (cargo-cyclonedx)
        run: |
          set -euxo pipefail
          cargo cyclonedx --format json -p "${{ steps.meta.outputs.id }}" || \
            echo "WARN: cargo-cyclonedx failed; TODO pin a working version"
          # Collect the emitted SBOM next to the artifact (path varies by cyclonedx ver).
          find . -name '*.cdx.json' -path '*'"${{ matrix.module }}"'*' -exec cp {} module.sbom.cdx.json \; || true

      - name: Registry login
        run: |
          # TODO: credentials for ${MODULE_REGISTRY}. Mirror to ghcr.io for CI if the
          #       Marketplace registry isn't reachable from GitHub-hosted runners.
          echo "TODO: oras/cosign login to ${MODULE_REGISTRY}"

      - name: Push wasm as OCI artifact (the Marketplace index entry)
        id: push
        run: |
          set -euxo pipefail
          REF="${{ steps.meta.outputs.artifact }}"   # registry.hookprobe.com/modules/<id>:<ver>
          # Push the .wasm as an OCI artifact with a wasm media type so the supervisor
          # can pull it like any signed OCI module.
          oras push "$REF" \
            module.wasm:application/wasm \
            module.sbom.cdx.json:application/vnd.cyclonedx+json || \
            { echo "TODO: oras push needs registry creds — see login step"; exit 1; }
          DIGEST="$(oras manifest fetch "$REF" --descriptor | yq -r '.digest')"
          echo "ref=${REF%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"
          # TODO: confirm the artifact media type the supervisor expects when it pulls
          #       + verifies a module (ADR 0003 module model).

      - name: "cosign SIGN + ATTEST SBOM (module.yaml signature: required)"
        run: |
          set -euxo pipefail
          cosign sign --yes "${{ steps.push.outputs.ref }}"
          cosign attest --yes --type cyclonedx --predicate module.sbom.cdx.json "${{ steps.push.outputs.ref }}"
          # TODO(PQC): composite ML-DSA-65 + Ed25519 (ADR 0002 §3) — interim classical.

      - name: SLSA provenance (module)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.meta.outputs.artifact }}
          subject-digest: ${{ steps.push.outputs.ref }}   # TODO: pass bare sha256 digest
          push-to-registry: true

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "module-${{ matrix.module }}"
          path: |
            module.wasm
            module.sbom.cdx.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2) SYSEXT images: host-integral kernel/eBPF bits. napse-capture is the one
  #    deliberate non-Wasm logic exception (XDP runs in-kernel). Build the /usr overlay
  #    into a per-arch OCI sysext, cosign-sign, push. (ovs is image-layer — see job 3.)
  # ---------------------------------------------------------------------------
  build-sysext:
    name: "sysext · ${{ matrix.module }} · ${{ matrix.arch }}"
    needs: test
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: napse-capture, arch: amd64 }
          - { module: napse-capture, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman squashfs-tools jq
      - uses: sigstore/cosign-installer@v3

      - name: Build CO-RE eBPF objects (TODO — toolchain not yet in repo)
        run: |
          set -euxo pipefail
          # napse-capture ships PRE-COMPILED CO-RE objects (no clang on-device,
          # runtime-engine-map §0). The eBPF .o build belongs HERE in CI.
          # TODO(REAL): build the XDP/eBPF CO-RE objects from modules/napse-capture/bpf/
          #             (V1 source: ~/hookprobe/core/napse/kernel/*.c + Zig XDP) with a
          #             pinned clang/llvm + libbpf, per-arch, and drop them into the
          #             sysext overlay at /usr/lib/hookprobe/xdp/. The bpf/ dir is a stub.
          echo "TODO: compile CO-RE eBPF objects for ${{ matrix.module }} (${{ matrix.arch }})"

      - name: Package /usr overlay as an OCI sysext image
        id: pack
        env:
          MOD: ${{ matrix.module }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          # The sysext is the /usr overlay under modules/<mod>/sysext/ plus its
          # extension-release marker. Package it as an OCI image so it's pullable +
          # cosign-signable like any other artifact; systemd-sysext merges it at boot.
          # TODO(REAL): confirm the exact sysext packaging the OS expects — a raw/squashfs
          #             DDI vs an OCI image carrying the /usr tree. This builds an OCI
          #             image from the overlay as the most registry-native option.
          cat > /tmp/Containerfile.sysext <<EOF
          FROM scratch
          COPY modules/${MOD}/sysext/ /
          LABEL hookprobe.module="${MOD}"
          LABEL hookprobe.runtime="sysext"
          EOF
          podman build --platform "linux/${ARCH}" -f /tmp/Containerfile.sysext \
            -t "hookprobe-sysext-${MOD}:${ARCH}" .
          echo "local=hookprobe-sysext-${MOD}:${ARCH}" >> "$GITHUB_OUTPUT"

      - name: Read sysext artifact ref + push + sign
        run: |
          set -euxo pipefail
          REF="$(grep -E '^artifact:' modules/${{ matrix.module }}/module.yaml | awk '{print $2}')"
          echo "TODO: registry login for ${MODULE_REGISTRY}; podman push ${{ steps.pack.outputs.local }} ${REF}"
          echo "TODO: cosign sign the pushed sysext digest (signature: required in module.yaml)"
          # SBOM for the sysext (binaries + eBPF objects):
          # TODO: syft the sysext image -> cyclonedx, cosign attest.

  # ---------------------------------------------------------------------------
  # 3) IMAGE-LAYER modules (ovs): assert — do NOT build a separate artifact.
  #    modules/ovs/module.yaml: runtime: image-layer, artifact: .../os/base —
  #    "config/units are covered by the bootc IMAGE signature; no separate sysext
  #    signature to verify." We only validate consistency so it can't silently drift
  #    into expecting its own (unsigned) artifact.
  # ---------------------------------------------------------------------------
  verify-image-layer:
    name: "image-layer consistency (ovs)"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert ovs is image-layer (covered by the OS image signature)
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends yq
          RUNTIME="$(yq -r '.runtime' modules/ovs/module.yaml)"
          ART="$(yq -r '.artifact' modules/ovs/module.yaml)"
          test "$RUNTIME" = "image-layer" \
            || { echo "FAIL: modules/ovs changed runtime to '$RUNTIME'; if it's now a separate sysext it MUST be built+signed in build-sysext (and base/Containerfile must stop shipping OVS)"; exit 1; }
          case "$ART" in */os/base) : ;; *) echo "FAIL: ovs artifact '$ART' should be the OS base image (image-layer)"; exit 1 ;; esac
          echo "OK: ovs is image-layer — signed via the OS image in build-os.yml, no separate artifact."
