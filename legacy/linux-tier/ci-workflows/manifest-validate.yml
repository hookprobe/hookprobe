name: manifest-validate

# Validates every Platform Manifest example against the canonical JSON Schema
# (ADR 0003) plus the semantic invariants the schema can't express.

on:
  push:
    paths:
      - "manifest/**"
      - ".github/workflows/manifest-validate.yml"
  pull_request:
    paths:
      - "manifest/**"
      - ".github/workflows/manifest-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r manifest/requirements.txt

      - name: Validate Platform Manifests
        run: python3 manifest/validate.py
