[package]
name = "hookprobe-supervisor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hookprobe-supervisor"
path = "src/main.rs"

[features]
# The real Wasm loader (Wasmtime). Off by default so the reconcile-logic tests stay a light,
# fast build; the shipping supervisor is built with `--features wasm`.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:sha2", "dep:hex"]

[dependencies]
hookprobe-manifest = { path = "../crates/hookprobe-manifest" }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wasmtime = { version = "27", optional = true }
wasmtime-wasi = { version = "27", optional = true }
# .cwasm <-> .wasm sha256 binding sidecar (ADR 0009 gap 2) — same versions hookprobe-manifest
# already pulls in for module_sig.rs, so this adds no new dependency *tree*, just a direct edge.
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
