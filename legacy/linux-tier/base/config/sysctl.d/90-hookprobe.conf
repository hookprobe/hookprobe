# 90-hookprobe.conf — sysctls tuned for the security dataplane + many sandboxed
# modules. Conservative + security-leaning by default; the data plane is OUT-OF-BAND
# by default (Readme "Data plane & availability"), so forwarding is OFF until intent
# enables an inline interface.

# --- eBPF / XDP (NAPSE capture sysext) ---------------------------------------
# JIT on for XDP/eBPF performance.
net.core.bpf_jit_enable = 1
# Lock down unprivileged BPF — capture/telemetry run privileged (CAP_BPF) via the
# sysext, never unprivileged. Defence-in-depth for a security box.
kernel.unprivileged_bpf_disabled = 1

# --- capture buffers ----------------------------------------------------------
# Larger socket buffers for AF_XDP / pcap rings so bursts don't drop silently
# (every drop must be visible, not silent — Architecture §7). TODO: tune per profile.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.netdev_max_backlog = 16384

# --- many modules + watchers --------------------------------------------------
# Wasm modules + Quadlet services + file watchers need generous inotify limits.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288

# --- rootless containers ------------------------------------------------------
# User namespaces for rootless Podman/Quadlet modules.
user.max_user_namespaces = 28633

# --- appliance memory behaviour ----------------------------------------------
# Prefer keeping the live working set resident over swapping (latency-sensitive).
vm.swappiness = 10

# --- forwarding: OFF by default (out-of-band default; inline is opt-in) -------
# AEGIS enables forwarding ONLY on interfaces an inline intent assigns (per-iface).
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# --- KSPP kernel-self-protection hardening (ADR 0006) — safe for our eBPF/routed-AP dataplane. ---
kernel.kptr_restrict = 2          # hide kernel pointers from /proc (KSPP)
kernel.dmesg_restrict = 1         # only CAP_SYSLOG reads the kernel log (KSPP)
kernel.yama.ptrace_scope = 1      # restrict ptrace (1 = descendants only; keeps admin debug via sudo)
kernel.kexec_load_disabled = 1    # block kexec — can't hot-swap the kernel under an immutable OS
kernel.perf_event_paranoid = 2    # restrict unprivileged perf (our loader is privileged → unaffected)
net.ipv4.conf.all.log_martians = 1  # log spoofed/impossible src (the SOC wants this signal)
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
# --- .default scope (GAP-6): bridges/VRFs (vrf-hp-*) and the routed-AP radio are created AFTER
# boot by the reconciler and inherit from `.default`, so the redirect/martian hardening above must
# be duplicated here or it never applies to the dynamic dataplane interfaces. sysctl.d loads at
# boot BEFORE the reconciler runs, so these are inherited by every iface it creates.
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# --- router / appliance network hardening (GAP-6) — safe for the out-of-band + routed-AP planes ---
net.ipv4.tcp_syncookies = 1                         # SYN-flood resilience (this box is a router/IPS)
net.ipv4.conf.all.accept_source_route = 0           # never honor source-routed packets
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1            # smurf/amplification protection
net.ipv4.icmp_ignore_bogus_error_responses = 1
# --- host self-protection (GAP-6) ---
fs.suid_dumpable = 0                                 # no core dumps from setuid processes
kernel.sysrq = 0                                     # no magic-sysrq (recovery is A/B rollback, not console)
# NOTE: rp_filter is deliberately NOT forced here — strict RPF breaks multi-WAN failover + the routed
# AP; the eBPF engine (napse_detect) does selective RPF via bpf_fib_lookup on the WAN role instead.
