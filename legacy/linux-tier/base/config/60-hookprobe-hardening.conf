# HookProbe OS security-appliance hardening (2026-07-07, live-Pi audit D-LOW-8).
# CANONICAL SOURCE — staged into the image's /etc/systemd/resolved.conf.d/ by build-arm64.sh /
# build-vm.sh. (Do NOT hand-place a copy in mkosi.extra: a clean `rm -rf mkosi.extra` rebuild would
# silently drop it — the exact build-pipeline gap this canonical home + staging line fixes.)
#
# systemd-resolved otherwise opens LLMNR on 0.0.0.0:5355 (and [::]:5355) across EVERY interface,
# INCLUDING the WAN uplink (end0) — a link-local name-resolution responder that is a well-known
# name-spoofing / credential-relay / info-leak surface (LLMNR poisoning) and has NO role on this
# device: DNS is served by the SASE-edge resolver on the LAN, not by peer multicast. We also drop
# resolved's own multicast-DNS (5353) responder — the ADR-0010 captive-portal `.local` name is
# owned by avahi as a separate daemon, never by resolved. Both are pure attack-surface reduction.
[Resolve]
LLMNR=no
MulticastDNS=no
