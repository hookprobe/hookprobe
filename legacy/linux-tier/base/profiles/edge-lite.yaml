# profiles/edge-lite.yaml — leanest variant for small ARM SBCs (Pi 5 / CM5, ≤4 GB).
# Maps to platform.class = edge-lite (ADR 0003). Out-of-band SOC is the expected
# posture on this tier (Readme "Resource limits & performance": Pi-class = mostly
# out-of-band). Keep the baked footprint minimal; heavy container modules are pulled
# only if/when a capability is granted + budget allows.

profile: edge-lite
class: edge-lite            # platforms/*.yaml may still classify hardware more specifically
target_arch: arm64

build_args:
  PROFILE: edge-lite
  TARGETARCH: arm64

# Package deltas vs the Containerfile baseline. The baseline already ships podman,
# wasmtime, OVS, eBPF/XDP libs, cosign. On the lite tier we DON'T pre-pull heavy
# extras; OVS stays installed (image-layer) but disabled until `sdn` is granted.
packages:
  include:
    # Pi/CM5 onboard Wi-Fi (brcmfmac) + common edge radios need a firmware blob.
    - firmware-brcm80211
    - firmware-misc-nonfree
    # Light cellular-modem support (drop if no cellular on this SKU).
    - modemmanager
    - libmbim-utils
  # (OVS is in the baseline but preset-disabled.) See docs/architecture/driver-strategy.md for
  # out-of-tree drivers (USB Wi-Fi dongles, some 5G modems) → driver sysext / variant.
  exclude: []
  # TODO: evaluate dropping usbutils/pciutils after first boot — they're only needed
  #       by the one-shot scanner; an immutable image keeps them, but they're tiny.

# Slices: live + background only (no extra). Defaults from base/units apply.

kargs_extra:
  # SBC serial console is common for headless Pi/CM5. TODO: confirm per board (the
  # DTB-specific console belongs in the platforms/ layer, not the profile).
  - "console=ttyS0,115200"
  - "console=tty1"

# bootc-image-builder output.
bib:
  types: ["raw"]           # raw → compressed to .img.xz for SBC flashing (Pi Imager / dd)
  target_arch: aarch64
  compress: xz             # produce hookprobe-edge-lite.img.xz
  # Filesystem/partition customization: a SEPARATE labelled data partition so
  # `bootc upgrade` never touches telemetry/evidence (ADR 0003).
  filesystem:
    - mountpoint: /
      minsize: "6 GiB"
    - mountpoint: /var/lib/hookprobe
      label: hookprobe-data
      minsize: "4 GiB"     # grows to fill the SD/eMMC on first boot (growpart, TODO)
      type: ext4
  # TODO: validate this maps to the pinned bootc-image-builder config.toml schema;
  #       Pi needs bootupd/firmware handling (cf. fedora-bootc-raspi) — confirm the
  #       Bootcrew Debian base ships the Pi bootloader bits or layer them in.
  seed_engine: cloud-init  # broad-compat fallback; `cloud-init clean` MANDATORY pre-image
