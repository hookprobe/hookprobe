[package]
name = "hookprobe-execsnoop"
version = "0.1.0"
edition = "2021"
description = "eBPF execsnoop loader: sched_process_exec → ingest_host_event JSON (evidence-graph host layer)."

[[bin]]
name = "hookprobe-execsnoop"
path = "src/main.rs"

# fanotify file-access producer — the FILE half of the host layer (execsnoop is the process half).
# Pure libc syscalls, no eBPF/libbpf → builds + cross-compiles anywhere (no `bpf` feature needed).
[[bin]]
name = "hookprobe-fanotify"
path = "src/bin/fanotify.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
# proper JSON string encoding — attacker-controllable comm/filename/path can contain newlines/control
# bytes; hand-escaping (only \ and ") would let a local process forge evidence-graph telemetry lines.
serde_json = "1"
# File-hash IOC wiring (2026-07-09, `hookprobe-fanotify`): a real content sha256 on FAN_CLOSE_WRITE,
# so `hookprobe_hydra::matcher::match_hash` has a live host event to evaluate bundled malware-hash
# IOCs against. Pure Rust, no libbpf/vendored-C — builds everywhere this crate already builds.
sha2 = "0.10"
# BPF glue is optional (mirrors napse-capture/loader): the pure event→JSON logic builds + tests anywhere;
# the load/attach/ringbuf path needs libbpf + the compiled execsnoop.bpf.o → `--features bpf`.
# `vendored` (not just libbpf-rs's default `vendored-libbpf`) ALSO vendors+builds libelf/zlib from
# source for the target (mirrors modules/napse-quarantine/loader/Cargo.toml exactly — same gap,
# same fix): this dev box (and most CI images) have no aarch64-glibc system libelf/libz to link
# against otherwise. Needs autoconf/automake/libtool/autopoint/flex/bison (elfutils' build system)
# in addition to clang + the aarch64 gcc cross toolchain — see modules/napse-quarantine/README.md's
# cross-compile trail, which this module's own aarch64-gnu build now follows too (2026-07-05).
libbpf-rs = { version = "0.24", optional = true, features = ["vendored"] }
# Only under `bpf`: the shared `xdp::apply_btf_custom_path` wiring. execsnoop.bpf.c is CO-RE
# (vmlinux.h + BPF_CORE_READ), so on the RPi BSP kernels (no CONFIG_DEBUG_INFO_BTF) it needs the
# shipped btf_custom_path blob or it crash-loops `kernel BTF is missing -ESRCH` (ADR 0029/0030).
hookprobe-manifest = { path = "../../../crates/hookprobe-manifest", optional = true }

[features]
default = []
bpf = ["dep:libbpf-rs", "dep:hookprobe-manifest", "hookprobe-manifest/bpf"]
