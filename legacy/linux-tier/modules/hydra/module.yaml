# modules/hydra/module.yaml — HYDRA threat-intelligence & enrichment pipeline.
#
# CORRECTED 2026-07 (ADR 0015 C1): this file previously declared HYDRA as "Automation &
# Orchestration" (the Automate workspace). That was stale against project canon —
# CLAUDE.md and docs/research/v2-reconciliation.md (2026-06-29 reconciliation, confirmed 4x on real
# devices: fortress-ids, guardian-hydra-lite "Threat Feed Sync", the cloud's 11-service
# ids-hydra-* pipeline) place HYDRA in the **Intelligence** workspace (IOC/STIX/TAXII/MISP,
# CVE, anomaly, predictor — threat-intel/enrichment), NOT Automate. HYDRA's own shipped
# unit (`modules/hydra/units/hydra-feedsync.service` = "Threat Feed Sync") already agreed
# with the correction; only this manifest's title/workspace mapping was wrong. The
# "Automate" workspace is a net-new automation/SOAR concern seeded from the deterministic
# reconcilers (sdn_autopilot / organism_selfheal / nac-policy-sync) under AEGIS, not HYDRA.
#
# ADR 0024 (2026-07-08): HYDRA's CVE lens shipped as its OWN `modules/exploit/module.yaml`
# reference entry (`crates/hookprobe-exploit/`), a NEW registry id — release-engineer's own
# convention for a crate that had no pre-existing dedicated module id (same for `modules/api`,
# `modules/evidence`).
#
# ADR 0027 (2026-07-08): HYDRA's IOC/threat-intel/enrichment lens — `crates/hookprobe-hydra/`, a
# native binary + timer (SAME architectural class as `hookprobe-exploit`: it needs direct
# evidence-DB read+write, not a WASI sandbox) that matches a bundled, dated IOC feed
# (`security/threat-intel/`) against this device's own flow/application data and folds hits into
# the ONE evidence graph (`iocs` table + `enriched_by`/`ioc_seen_on` edges) via
# `hookprobe_evidence::EvidenceGraph::ingest_ioc_match`, served at `GET /api/intel` — now SHIPS
# through THIS file (unlike `hookprobe-exploit`, which got a brand-new `modules/exploit` id):
# `hydra` is ALREADY the canonical registry id for this exact capability domain (title/workspace
# both existed, just with nothing buildable behind them) — reusing it, rather than minting a
# second `modules/hydra-intel`, is the more coherent "one system" choice: one HYDRA id, one place
# an operator/auditor looks for "what does HYDRA ship." `status: stub` is REMOVED (see below): this
# is now a real, staged, signed module.
#
# NOTE — a THIRD, pre-existing, UNRELATED "HYDRA threat feed" already lives under THIS module id:
# `hydra-feed-fetch.sh` + `units/hydra-feedsync.{service,timer}` (source:
# `modules/napse-capture/loader/src/bin/hydra-feedsync.rs`) is a LIVE CIDR-blocklist fetch that
# feeds a pinned eBPF blocklist map — an ENFORCEMENT primitive. It is deliberately NOT staged by
# this `module.yaml` and NOT merged with `crates/hookprobe-hydra` (detection/enrichment only, never
# touches enforcement — ADR 0027 gate 0.7): same "HYDRA" name, two non-overlapping capabilities,
# kept separate on purpose — this remains a documented, tracked, NOT-yet-staged gap (unchanged by
# this pass; out of ADR 0027's scope). See ADR 0027 §"Relationship to hydra-feedsync".
#
# Canon: docs/adr/0027-hydra-ioc-threat-intel-enrichment.md (this module's own ADR),
# security/threat-intel/README.md (the bundled feed format + honest limits), docs/adr/0015-
# registry-driven-module-inclusion.md (C3 reference-entry pattern, same as modules/exploit/
# modules/api/modules/evidence).

id: hydra
version: 2.0.0
title: "HYDRA — Threat Intelligence & Enrichment"
workspace: Intelligence
runtime: host                  # host-integral binary + timer; ordinary file I/O + direct
                                # evidence-DB read/write only — matches evidence's/api's/exploit's
                                # own `runtime: host` classification, not the Wasm sandbox (the
                                # SAME reasoning ADR 0024 gave for hookprobe-exploit).
artifact: base                 # host-integral; delivered IN the bootc image (no separate OCI)

requires:
  capabilities: [soc]           # baseline SOC capability, same floor evidence/api/exploit require.
  min_memory_mb: 128            # matches the unit's own hand-authored MemoryMax=128M.

grants:                         # the ONLY host access this binary opens (see the unit's own
                                # ExecStart args + hardening: ProtectSystem=strict,
                                # ReadWritePaths=/var/lib/hookprobe, no CAP_NET_ADMIN/CAP_BPF —
                                # alert/enrich only, ADR 0027 gate 0.7, never enforcement).
  - read:  /usr/share/hookprobe/threat-intel/ioc-feed.json
  - write: /var/lib/hookprobe/evidence.db

provides:
  capabilities: [hydra_intel]    # downstream: Mission Control's Intelligence workspace
                                  # (`/api/intel` — crates/hookprobe-api's `intel` route) gates on
                                  # this token for the REAL IOC/enrichment data instead of a UI mock.

resources:
  cpu_pct: 10
  memory_mb: 128                 # matches the unit's own MemoryMax=128M; deferrable/background
                                  # (unit's own Slice=hookprobe-background.slice).

# staging: — the crate lives OUTSIDE modules/ (see header, same as exploit/evidence/api), so this
# cannot use the wasm convention; one of the five explicit override blocks ADR 0015 D1 calls for.
# Also stages the bundled IOC feed snapshot (security/threat-intel/) — data, not a build target —
# renamed to the undated on-device name `hookprobe-hydra`'s CLI default expects
# (security/threat-intel/README.md: "the dated snapshot symlinked/copied at image build").
staging:
  build:
    - crate: hookprobe-hydra
      toolchain: gnu            # transitively pulls hookprobe-evidence's bundled SQLite
                                # (rusqlite `bundled`) — needs a glibc target, NOT musl, same
                                # aarch64-GNU cross-recipe as hookprobe-evidence/hookprobe-exploit/
                                # hookprobe-sigma (see modules/napse-quarantine/README.md's
                                # exact-glibc-2.36 sysroot trail).
  artifacts:
    - { src: "{gnu_bin}/hookprobe-hydra", dest: "/usr/lib/hookprobe/hookprobe-hydra", mode: "0755" }
    - { src: "security/threat-intel/snapshots/ioc-feed-2026-07-08.json", dest: "/usr/share/hookprobe/threat-intel/ioc-feed.json", mode: "0644" }
  units:
    - "crates/hookprobe-hydra/units/hookprobe-hydra.service"
    - "crates/hookprobe-hydra/units/hookprobe-hydra.timer"
  # No `preset:` override needed — both units carry their own `[Install]` section and this
  # module's `requires.capabilities` ([soc]) hits neither of gen-staging.sh's HARDWARE_GATED_CAPS,
  # so the generator's own default_verb ("enable") already applies (same convention as
  # evidence/exploit/sigma).

# Payload digest (ADR 0016, arch-qualified per ADR 0021) — on-device dest path (this crate lives
# outside modules/, see header). The feed snapshot is arch-independent (role: data, single entry,
# same convention modules/exploit/ovs/senzorium-flow already use for their own baked-in data
# files). The `role: executable` `value`s are REAL sha256 of `hookprobe-hydra` built fresh in this
# pass for x86_64-unknown-linux-gnu (native) and aarch64-unknown-linux-gnu (the same exact-glibc-
# 2.36 sysroot wrapper modules/napse-quarantine/README.md's trail documents; verified via
# `objdump -T`, tops out at GLIBC_2.34, comfortably under the Pi's 2.36), each written by
# `hookprobe-supervisor --write-artifact-digests hydra` run under that arch (arm64 via
# qemu-aarch64-static/binfmt so `module_sig::running_arch()` reports `arm64` correctly) — NEVER
# hand-`sha256sum`'d. A real release pipeline re-runs it against its OWN per-arch build before
# shipping (D3's build -> digest -> sign order — `builder/sign-release.sh` enforces it).
artifacts:
  - path: /usr/lib/hookprobe/hookprobe-hydra
    role: executable
    arch: amd64
    digest:
      alg: sha256
      value: "a8df4a459bac6e1353fbdef55096148f0e2cdb9de011b882e7d0ee9104a30df9"
  - path: /usr/lib/hookprobe/hookprobe-hydra
    role: executable
    arch: arm64
    digest:
      alg: sha256
      value: "22474c43fedc2b5067f12db8c037f44c4e6e319612cc048793063dd10360d425"
  # digest re-pinned 2026-07-16: the seed feed gained ja4 + ja4s canaries (roadmap-B JA4 activation),
  # changing its sha256 from 80b7da1b… to a9b16485… (ADR 0016 fail-closed requires the pin to track).
  - path: /usr/share/hookprobe/threat-intel/ioc-feed.json
    role: data
    digest:
      alg: sha256
      value: "a9b16485c63d9af5b61a86f7c2ca15332297d1f00f7d7d84717c6f6f6c443a28"

signature: required             # cosign-signed like every other staged artifact; the device
                                # VERIFIES, never signs (ADR 0002 §5). Detection/enrichment ONLY —
                                # this module never touches enforcement (ADR 0027 gate 0.7): no
                                # CAP_NET_ADMIN/CAP_BPF grant, no nft/tc/BPF-map access, distinct
                                # from `hydra-feedsync`'s enforcement primitive (see header NOTE).
