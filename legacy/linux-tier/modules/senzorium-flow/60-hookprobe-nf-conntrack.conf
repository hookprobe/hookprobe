# 2026-07-05 FIX (backend-audit P2 #7 — senzorium-flow silent-skip gate #1): senzorium-flow.service
# gates its ENTIRE run on `ConditionPathExists=/proc/net/nf_conntrack`, which only exists once the
# `nf_conntrack` kernel module is LOADED — nothing in this image loaded it before this fix, so on a
# kernel that has the module built but not auto-loaded (no NAT/conntrack-triggering traffic yet,
# or a minimal module set), the condition silently failed and the software flow-capture floor never
# ran at all (no failure, no journal warning — a genuinely SILENT gap: `systemctl status` merely
# shows "condition failed", easy to miss). Loading the module explicitly at boot via
# systemd-modules-load.service (this file, staged to /etc/modules-load.d/) makes
# /proc/net/nf_conntrack reliably present on any kernel that ships the module at all — the
# ConditionPathExists check in senzorium-flow.service remains (a kernel genuinely built WITHOUT
# conntrack support at all still degrades gracefully, honestly skipped, never a hard boot failure).
nf_conntrack
