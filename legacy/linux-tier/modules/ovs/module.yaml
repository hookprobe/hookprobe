# modules/ovs/module.yaml — OpenVSwitch dataplane (host-integral SDN).
#
# RUNTIME CHOICE: image-layer (NOT a standalone sysext).
# Justification: the OVS BINARIES (openvswitch-switch / openvswitch-common) are ALREADY
# baked into the base image (base/Containerfile Layer A, the `openvswitch` capability).
# A sysext that re-shipped /usr/bin/ovs-* would duplicate what the base already provides.
# So this "module" contributes only CONFIG + a manifest-driven BRING-UP UNIT + the
# per-segment fail-mode wiring — all of which also live in the image. That is the
# definition of an image-layer module: no separate /usr overlay, versioned atomically
# with the OS via bootc.
#
# WHEN IT WOULD BE A SYSEXT INSTEAD: if OVS were removed from the base (to keep the base
# minimal) OR for the patched `hostapd-ovs` build (~/hookprobe/shared/hostapd-ovs, which
# is NOT in the base) — that patched hostapd is a separate sysext candidate (provides
# wifi_ap-over-OVS). This module is OVS proper; hostapd-ovs is out of scope here.
#
# Canon: docs/architecture/runtime-engine-map.md (shared/hostapd-ovs + shared/network rows; `sdn`
# token), docs/architecture/Readme.md (Pillar 1 image-layer; "Data plane"), docs/architecture/Architecture.md
# (C12; §4.4 OS-Agent bridge programs OVS flows), docs/adr/0003 (openvswitch capability).

id: ovs
version: 0.1.0
title: "OpenVSwitch dataplane (SDN)"
runtime: image-layer          # binaries baked in base; this adds config + bring-up only
artifact: registry.hookprobe.com/os/base        # delivered IN the bootc image, not a separate OCI

requires:
  capabilities: [openvswitch] # granted when arch ok ∧ >=2 interfaces (ADR 0003 example).
                              # NIC/driver known-good gating lives in platforms/*.yaml.

grants:                       # host access — like napse-capture, beyond what Wasm can hold.
  # OVS owns a kernel datapath (openvswitch.ko) + a control daemon (ovs-vswitchd) +
  # a config DB (ovsdb-server). Programming bridges/ports/flows needs net admin + the
  # kernel module. A Wasm module can do NONE of this; flow PROGRAMMING by policy modules
  # is funneled through the OS-Agent bridge (Architecture §4.4), not granted to Wasm.
  - cap: [net_admin, sys_module]
      # net_admin  → create bridges/ports, set OpenFlow flows, fail-mode (ovs-vsctl/ofctl)
      # sys_module → ensure the openvswitch kernel datapath module is loaded
  - kmod: openvswitch         # the datapath; userspace datapath (netdev) is the fallback

provides:
  capabilities: [sdn]         # programmable OpenFlow dataplane for segmentation/AEGIS.
                              # (runtime-engine-map §2: `sdn` granted when `openvswitch` is.)

resources:
  slice: hookprobe-dataplane.slice   # ovs-vswitchd/ovsdb-server bounded by the host slice
                                     # (NOT a Wasm budget; see base/sysext/).

signature: required           # config/units are covered by the bootc IMAGE signature
                              # (image-layer) — no separate sysext signature to verify.

# staging: — ADR 0015 D1 explicit override (image-layer convention). Both units are
# "managed": openvswitch-switch.service is an APT-package unit this module does not ship
# (the base preset's own `disable openvswitch-switch.service` line covers it, unchanged);
# hookprobe-ovs.service is this module's own bring-up unit, started by the supervisor only
# when `openvswitch`/`sdn` is granted (D4 image-layer default: "ovs = disable, supervisor
# starts on demand") — so no preset-enable line is emitted for it either.
staging:
  artifacts:
    - { src: "modules/ovs/config/ovs-bringup", dest: "/usr/lib/hookprobe/ovs/ovs-bringup", mode: "0755" }
    - { src: "modules/ovs/config/segments.yaml", dest: "/usr/lib/hookprobe/ovs/segments.yaml", mode: "0644" }
    # GAP-7: preload openvswitch.ko at boot so hookprobe-ovs.service needs no CAP_SYS_MODULE.
    - { src: "modules/ovs/50-hookprobe-openvswitch.conf", dest: "/etc/modules-load.d/50-hookprobe-openvswitch.conf", mode: "0644" }
  units:
    - "modules/ovs/units/hookprobe-ovs.service"
  preset:
    hookprobe-ovs.service: managed

# Payload digests (ADR 0016) — on-device dest paths (image-layer: config baked into the base
# image, not co-located with this module.yaml). Byte-identical plain-file staging (no
# compilation), so computed directly from the checked-in `modules/ovs/config/*` sources
# (sha256sum) — see the same note in modules/senzorium-flow/module.yaml.
artifacts:
  - path: /usr/lib/hookprobe/ovs/ovs-bringup
    role: executable
    digest:
      alg: sha256
      value: "9d70b7faa3dffddd4a03c04feee167050601ac4a6714fd625fb5ae9c56a1c65d"
  - path: /usr/lib/hookprobe/ovs/segments.yaml
    role: data
    digest:
      alg: sha256
      value: "b8451f9a67c2ba8cb0e0480e44f37e8d351fdcd42804159daf91a49f9b92c3e4"
  - path: /etc/modules-load.d/50-hookprobe-openvswitch.conf
    role: data
    digest:
      alg: sha256
      value: "6c87355813119116e6d486766a458133000f876511c5eeb04e9b8053aaeb3b7f"
