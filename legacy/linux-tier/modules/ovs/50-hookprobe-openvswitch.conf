# Preload the OVS kernel datapath at boot (systemd-modules-load.service, PID-1 privileged) so that
# hookprobe-ovs.service does NOT need CAP_SYS_MODULE to modprobe it itself (audit GAP-7 — dropping
# the load-arbitrary-kernel-module capability, which is especially dangerous while the Pi kernels
# still load unsigned modules, GAP-2). If openvswitch.ko is absent (minimal image without
# openvswitch-switch) this line is a harmless no-op and ovs-bringup falls back to the userspace
# (netdev) datapath — the same graceful degrade it already had.
openvswitch
