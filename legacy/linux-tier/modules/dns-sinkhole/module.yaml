# modules/dns-sinkhole/module.yaml — DNS sinkhole / RPZ enforcement (roadmap A1).
#
# The safest possible attack-block: refuses a NAME (per-query, reversible, NXDOMAIN/sinkhole),
# never a customer's PACKET — fits the "legit customer always passes" invariant (ADR 0023) far
# better than any packet-drop primitive. Merges `modules/dnsxai`'s BLOCK_INSTANT verdicts + HYDRA's
# bundled domain IOCs (ADR 0027) into an allowlist-guarded RPZ zone / dnsmasq blocklist, and
# records each sinkhole action as a reversible, TTL-able evidence-graph response — see
# `docs/adr/0033-dns-sinkhole-rpz.md`.
#
# `crates/hookprobe-dns-sinkhole/` lives OUTSIDE modules/ (same shape as HYDRA/exploit/evidence/
# api — ADR 0015 C3's reference-entry pattern): a native binary + timer, direct filesystem
# read/write, not a WASI sandbox (same reasoning ADR 0024/0027 gave for hookprobe-exploit/hydra —
# this needs to write generated resolver config under /var/lib + read an operator-owned allowlist
# under /etc, neither of which the WASI capability model here currently expresses cleanly for a
# file-tree write).
#
# HONEST INTEGRATION GAP (see the ADR + this crate's own module doc): this device's actually-wired
# LAN resolver is systemd-resolved (`crates/hookprobe-manifest/src/lan.rs`), which has NO RPZ /
# domain-blocklist support at all. This module ships the artifact (RPZ zone + dnsmasq conf) + the
# apply hook regardless — tool-gated exactly like `network-apply.sh`'s existing OVS/nft steps ("if
# the resolver isn't RPZ/dnsmasq-capable, log a named gap and skip, never hard-fail the rest of the
# apply"). An operator running a capable resolver (BIND/Unbound/Knot/dnsmasq) gets real enforcement
# today; systemd-resolved-only devices get the artifact + evidence-graph visibility, staged for the
# day resolved gains blocklist support or an operator swaps resolvers.

id: dns-sinkhole
version: 0.1.0
title: "DNS Sinkhole / RPZ Enforcement"
workspace: Protect
runtime: host                  # host-integral binary + timer; ordinary file I/O only — matches
                                # evidence/api/exploit/hydra's own `runtime: host` classification.
artifact: base                 # host-integral; delivered IN the bootc image (no separate OCI)

requires:
  capabilities: [soc]           # baseline SOC capability, same floor evidence/api/exploit/hydra require.
  min_memory_mb: 64             # matches the unit's own hand-authored MemoryMax=64M.

grants:                         # the ONLY host access this binary opens (see the unit's own
                                # hardening: ProtectSystem=strict, ReadWritePaths=/var/lib/hookprobe,
                                # ReadOnlyPaths=/etc/hookprobe, no CAP_NET_ADMIN/CAP_BPF — DNS-layer
                                # artifact generation ONLY, never touches the packet-drop path).
  - read:  /var/lib/hookprobe/dns-verdicts               # dnsxai's BLOCK_INSTANT signal
  - read:  /usr/share/hookprobe/threat-intel/ioc-feed.json  # HYDRA's bundled domain IOCs
  - read:  /etc/hookprobe/dns-sinkhole-allowlist.yaml     # operator-owned FP-safety override
  - write: /var/lib/hookprobe/dns-sinkhole                # generated RPZ zone + dnsmasq conf + state
  - write: /var/lib/hookprobe/responses                   # evidence-graph track/trace (shared stream)

provides:
  capabilities: [dns_sinkhole]   # downstream: Mission Control's Protect workspace gates its DNS
                                  # sinkhole surface on this token instead of a UI mock; also
                                  # informs network-apply.sh whether to install the resolver artifact.

resources:
  cpu_pct: 5
  memory_mb: 64                  # matches the unit's own MemoryMax=64M; deferrable/background
                                  # (unit's own Slice=hookprobe-background.slice).

# staging: — the crate lives OUTSIDE modules/ (see header), one of ADR 0015 D1's five explicit
# override blocks. Also stages the OPERATOR-OWNED allowlist DEFAULT (empty, comment-only — this
# binary only ever READS it, never generates/overwrites it; an operator's own edit on a live
# device is never clobbered by a re-provision).
staging:
  build:
    - crate: hookprobe-dns-sinkhole
      toolchain: gnu             # transitively pulls hookprobe-hydra -> no bundled-SQLite
                                  # dependency here (this crate never opens evidence.db directly —
                                  # it only APPENDS to the shared /var/lib/hookprobe/responses text
                                  # stream, same as scan_responder.sh's shell-side writers), but gnu
                                  # (not musl) is still required transitively via hookprobe-hydra's
                                  # own toolchain pin.
  artifacts:
    - { src: "{gnu_bin}/hookprobe-dns-sinkhole", dest: "/usr/lib/hookprobe/hookprobe-dns-sinkhole", mode: "0755" }
    - { src: "modules/dns-sinkhole/dns-sinkhole-allowlist.default.yaml", dest: "/etc/hookprobe/dns-sinkhole-allowlist.yaml", mode: "0644" }
  units:
    - "crates/hookprobe-dns-sinkhole/units/hookprobe-dns-sinkhole.service"
    - "crates/hookprobe-dns-sinkhole/units/hookprobe-dns-sinkhole.timer"
  # No `preset:` override needed — both units carry their own `[Install]` section and this
  # module's `requires.capabilities` ([soc]) hits neither of gen-staging.sh's HARDWARE_GATED_CAPS,
  # same convention as evidence/exploit/sigma/hydra.

# Payload digests (ADR 0016, arch-qualified per ADR 0021) — one `role: executable` entry per
# built arch for this same on-device path, exactly the `napse-quarantine` `role: loader`
# convention (see that module.yaml's own multi-arch block).
#
# amd64: a REAL sha256 of this pass's release build (`cargo build --release -p
# hookprobe-dns-sinkhole`, x86_64-unknown-linux-gnu, this dev box) — never hand-`sha256sum`'d
# against a stale binary.
#
# CLOSED 2026-07-16 (release-engineer, ADR 0021/0016 supply-chain gap closure): the arm64 gap this
# comment used to describe is now closed. The crate WAS already cross-built for arm64
# (`target/aarch64-unknown-linux-gnu/release/hookprobe-dns-sinkhole`, gnu toolchain per this
# module's own `staging.build[0].toolchain: gnu` pin) and staged, but the digest below was never
# populated — leaving the arm64 binary cryptographically UNBOUND (the exact anti-swap gap ADR
# 0016/0021 exist to close). Populated the honest way: appended this `arch: arm64` stub entry,
# then ran the SAME tool the amd64 entry above was produced by —
# `hookprobe-supervisor --write-artifact-digests dns-sinkhole --modules modules` — under
# `qemu-aarch64-static` against the repo's already-built static-musl `aarch64-unknown-linux-musl`
# supervisor (the `builder/refresh-aot.sh` arm64 recipe's preferred no-sysroot path: `running_arch()`
# is a compile-time `cfg!(target_arch)` check, so the musl-vs-gnu libc of the *supervisor* running
# the digest tool doesn't matter — it correctly resolves+hashes the staged GNU dns-sinkhole binary
# named by `staging.artifacts[].src`). Never hand-`sha256sum`'d into the YAML.
artifacts:
  - path: /usr/lib/hookprobe/hookprobe-dns-sinkhole
    role: executable
    arch: amd64
    digest:
      alg: sha256
      value: "10e1f289f378d92cbd52b8f9621b7c3d254e592cbf16b4737c88aa1817e0f608"
  - path: /usr/lib/hookprobe/hookprobe-dns-sinkhole
    role: executable
    arch: arm64
    digest:
      alg: sha256
      value: "45bf47c789a8da9b09aabbe23515873a92b09ac0e0aa7e991666c45774cf049e"
  - path: /etc/hookprobe/dns-sinkhole-allowlist.yaml
    role: data
    digest:
      alg: sha256
      value: "a05c1303e66991224adbc8ff963c49e3664d2939cb507e0b188027db32042ae8"

signature: required             # cosign-signed like every other staged artifact; the device
                                 # VERIFIES, never signs (ADR 0002 §5). DNS-layer artifact
                                 # generation ONLY (this module never touches enforcement's
                                 # packet-drop path): no CAP_NET_ADMIN/CAP_BPF grant, no nft/tc/
                                 # BPF-map access — distinct from `napse-quarantine`'s enforcement
                                 # primitive, matching HYDRA's own alert/enrich-only gate 0.7 stance.
