# Pi 4 wireless sensor config (sourced by wsensor-supervisor.sh). Installed to /etc/pi4-wsensor/.
# Fixed-channel monitoring of the heqk CM5 AP (HookProbe-Setup-R3Q1): ch36, VHT80, center 5210.
FREQ=5180
WIDTH=80
CENTER=5210
DATA_DIR=/var/lib/pi4-wsensor
RING_MB=10
MGMT_FILES=50
DATA_FILES=20
ROTATE_S=60
DATA_SNAP=128
EVENTS_KEEP_DAYS=7
EVENTS_MAX_MB=500
STALL_S=60
TICK=10
