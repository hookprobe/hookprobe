[package]
name = "heqk-boot-abi-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
boot-abi = { path = "../../../os/kernel/boot-abi", features = ["otaverify"] }

[workspace]

[[bin]]
name = "payload_header"
path = "fuzz_targets/payload_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fdt_parse"
path = "fuzz_targets/fdt_parse.rs"
test = false
doc = false
bench = false
