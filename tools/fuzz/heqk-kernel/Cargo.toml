[package]
name = "heqk-kernel-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
boot-abi = { path = "../../../os/kernel/boot-abi" }
ed25519-compact = { version = "2", default-features = false }
arch_aarch64 = { path = "arch-shim", package = "heqk-arch-shim" }

[workspace]

[[bin]]
name = "http_req"
path = "fuzz_targets/http_req.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_wire"
path = "fuzz_targets/dns_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_hello"
path = "fuzz_targets/tls_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_meta"
path = "fuzz_targets/frame_meta.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cfg_bundle"
path = "fuzz_targets/cfg_bundle.rs"
test = false
doc = false
bench = false
