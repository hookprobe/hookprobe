<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HookProbe CM5 flasher (development)</title>
</head>
<body>
<!-- Functional development page for ADR 0070; no styling. WebUSB needs a secure context: serve over
     https or http://localhost (e.g. `python3 -m http.server -d tools/flash/web 8000`), Chrome or Edge. -->
<h1>HookProbe CM5 flasher — development page</h1>
<p><strong>Not metal-verified. The heqk flash stub is not built yet</strong>: step 3 cannot complete on a real CM5 until it is.</p>
<ol>
  <li><label>Raspberry Pi boot files (<code>bootfiles.bin</code>, 2712): <input type="file" id="bootfiles"></label></li>
  <li><label>heqk flash stub ramdisk (<code>boot.img</code>): <input type="file" id="stub"></label></li>
  <li><label>config.txt override (optional; default <code>boot_ramdisk=1</code>): <input type="file" id="config"></label></li>
  <li><label>Disk image (<code>*.img</code>): <input type="file" id="disk"></label></li>
  <li><label>Image manifest (<code>*.img.json</code>, for the slot offset): <input type="file" id="manifest"></label></li>
</ol>
<p>
  <label><input type="checkbox" id="rpibootonly"> rpiboot only (stages 1-2; metal step M1)</label>
  <label><input type="checkbox" id="verifyonly" checked> Verify only (no write)</label>
  <label><input type="checkbox" id="debugstub"> Accept a DEBUG stub (bench only)</label>
</p>
<p>
  <button id="go">Connect CM5 (USB boot mode) and flash</button>
  <button id="reconnect" disabled>Reconnect</button>
</p>
<progress id="progress" max="1" value="0"></progress>
<pre id="log"></pre>
<script type="module" src="app.mjs"></script>
</body>
</html>
